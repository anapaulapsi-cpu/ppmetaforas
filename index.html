<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>O Poder das Metáforas na Prática Clínica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Mulish:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Paleta: Sage Green 98A086 · Dusty Rose A76D5E · Golden Tan C4A071 · Warm Beige DFCCB1 · Terracotta Brown 846044 */
:root{
  --bg:#F7F1E8; --surface:#FFFCF7; --ink:#34281F; --muted:#6F5F52; --line:#E6D9C7;
  --brown:#846044; --copper:#A76D5E; --caramel:#C4A071; --beige:#DFCCB1; --sage:#98A086;
  --teal:#5F6C4F; --teal-soft:#E9ECE0; --copper-soft:#F3E3DC; --tan-soft:#F4EAD9;
  --on-brown:#FFFCF7; --shadow:0 1px 2px rgba(92,64,44,.06),0 12px 32px -12px rgba(92,64,44,.22);
  --danger:#9A3B32;
  --sans:"Mulish", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --serif:"Cormorant Garamond", "Iowan Old Style", Georgia, "Times New Roman", serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#1D1915; --surface:#27211C; --ink:#F2E9DD; --muted:#BDAE9D; --line:#3E352C;
    --brown:#DDB892; --copper:#D89C8B; --caramel:#D6B686; --beige:#4A3E31; --sage:#AEB79C;
    --teal:#B7C1A3; --teal-soft:#2A2F24; --copper-soft:#3A2925; --tan-soft:#332A1F;
    --on-brown:#1D1915; --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 32px -12px rgba(0,0,0,.6);
    --danger:#E08A80;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#1D1915; --surface:#27211C; --ink:#F2E9DD; --muted:#BDAE9D; --line:#3E352C;
  --brown:#DDB892; --copper:#D89C8B; --caramel:#D6B686; --beige:#4A3E31; --sage:#AEB79C;
  --teal:#B7C1A3; --teal-soft:#2A2F24; --copper-soft:#3A2925; --tan-soft:#332A1F;
  --on-brown:#1D1915; --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 32px -12px rgba(0,0,0,.6);
  --danger:#E08A80;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 84px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16.5px;line-height:1.65;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:var(--brown)}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--copper);outline-offset:3px;border-radius:6px}
::selection{background:var(--beige);color:var(--ink)}

/* Topo */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.2) blur(10px);-webkit-backdrop-filter:saturate(1.2) blur(10px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1080px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;gap:18px}
.brand{flex:1;display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink);line-height:1.1;min-width:0}
.brand svg{flex:none;width:34px;height:34px}
.brand b{display:block;font-family:var(--serif);font-weight:600;font-size:1.28rem;letter-spacing:.005em}
.brand span{display:block;font-weight:600;font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;color:var(--copper);margin-top:3px}
.pilot{font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--teal);background:var(--teal-soft);padding:5px 11px;border-radius:99px;white-space:nowrap}
.nav{display:flex;gap:2px}
.nav a{text-decoration:none;color:var(--muted);font-weight:600;font-size:.88rem;padding:8px 13px;border-radius:99px;transition:color .15s,background .15s}
.nav a:hover{color:var(--ink)}
.nav a[aria-current="page"]{color:var(--brown);background:var(--tan-soft)}
@media (max-width:820px){
  .nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);justify-content:space-around;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:30;box-shadow:0 -8px 24px -16px rgba(92,64,44,.3)}
  .nav a{font-size:.74rem;padding:9px 4px;text-align:center;flex:1;border-radius:12px}
  body{padding-bottom:72px}
  .pilot{display:none}
  .topbar-in{padding:12px 16px}
  .topbar{background:var(--bg);backdrop-filter:none;-webkit-backdrop-filter:none}
}

main{max-width:1080px;margin:0 auto;padding:40px 24px 96px}
@media (max-width:520px){main{padding:28px 16px 80px}}
.narrow{max-width:720px}
h1,h2,h3{line-height:1.2;margin:0 0 .5em;text-wrap:balance}
h1{font-family:var(--serif);font-weight:600;font-size:clamp(2.1rem,5vw,3rem);letter-spacing:-.005em;line-height:1.08}
h2{font-family:var(--serif);font-weight:600;font-size:clamp(1.55rem,3vw,1.9rem);margin-top:1.8em;color:var(--ink)}
h3{font-size:1.02rem;font-weight:700;margin-top:1.3em}
p{margin:0 0 1em}
.lead{font-size:1.08rem;color:var(--muted);max-width:62ch}
.muted{color:var(--muted)}
.kicker{font-size:.72rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--copper);margin:0 0 10px}

/* Botões */
.btn{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--brown);background:var(--brown);color:var(--on-brown);padding:12px 22px;border-radius:99px;font-weight:700;font-size:.9rem;letter-spacing:.01em;cursor:pointer;text-decoration:none;transition:transform .15s,box-shadow .15s,background .15s}
.btn:hover{transform:translateY(-1px);box-shadow:0 8px 18px -10px rgba(92,64,44,.6)}
.btn.ghost{background:transparent;color:var(--brown)}
.btn.ghost:hover{background:var(--tan-soft);box-shadow:none}
.btn.small{padding:7px 15px;font-size:.82rem}
.btn.danger{background:transparent;border-color:var(--danger);color:var(--danger)}
.btn.danger.armed{background:var(--danger);color:var(--surface)}
.btn-row{display:flex;flex-wrap:wrap;gap:10px;margin:22px 0}
@media (prefers-reduced-motion:reduce){.btn,.m-card,.nav a{transition:none}.btn:hover,.m-card:hover{transform:none}}

/* Ramo botânico */
.sprig{display:block;color:var(--sage)}
.divider{display:flex;align-items:center;gap:14px;color:var(--sage);margin:56px 0 8px}
.divider::before,.divider::after{content:"";flex:1;border-top:1px solid var(--line)}
.divider svg{width:46px;height:20px}

/* Retorno */
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.opts label{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:8px 15px;font-weight:500;font-size:.9rem;cursor:pointer}
.opts input{accent-color:var(--copper);margin:0}
.opts label:has(input:checked){border-color:var(--copper);background:var(--copper-soft)}
.ret-q{margin:0 0 26px}
.ret-q > .ql{display:block;font-weight:600;margin-bottom:6px}
.ret-form{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:26px 26px 8px;margin-top:22px;box-shadow:var(--shadow)}
.ret-form input[type=text]{width:100%}
.ret-form legend{font-weight:700;padding:0;margin-bottom:8px}
.ret-form fieldset{border:0;padding:0;margin:0 0 26px;min-width:0}

/* Início */
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:48px;align-items:center;margin-bottom:8px}
.hero-title h1{font-size:clamp(2.5rem,6vw,4.1rem);margin:0;line-height:1}
.hero-title h1 .sub{display:block;font-style:italic;font-weight:500;color:var(--copper);font-size:.62em;margin-top:10px}
.hero-title .tag{font-size:1.1rem;color:var(--muted);margin:22px 0 0;max-width:44ch}
.hero-art{position:relative}
.hero-art img{width:100%;aspect-ratio:4/5;object-fit:cover;object-position:center 45%;border-radius:260px 260px 18px 18px;box-shadow:var(--shadow)}
.hero-art::before{content:"";position:absolute;inset:18px -18px -18px 18px;border:1px solid var(--caramel);border-radius:260px 260px 18px 18px;z-index:-1}
.facts{display:flex;flex-wrap:wrap;gap:10px 26px;margin:26px 0 0;padding:0;list-style:none;font-size:.86rem;color:var(--muted)}
.facts li{display:flex;align-items:baseline;gap:7px}
.facts b{font-family:var(--serif);font-size:1.6rem;font-weight:600;color:var(--brown);line-height:1}
@media (max-width:760px){
  .hero{grid-template-columns:1fr;gap:28px}
  .hero-art{order:-1;max-width:420px;margin-right:18px}
  .hero-art img{aspect-ratio:5/4;border-radius:200px 200px 16px 16px}
  .hero-art::before{border-radius:200px 200px 16px 16px}
}
.q{font-family:var(--serif);font-weight:500;font-size:clamp(1.8rem,4.6vw,2.8rem);line-height:1.12;margin:0 auto;max-width:760px;text-align:center}
.q span{display:block}
.q span:nth-child(3){color:var(--copper);font-style:italic}
.q-lead{text-align:center;margin:18px auto 0;max-width:58ch}

.path{list-style:none;margin:30px 0 0;padding:0;display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.path li{position:relative;font-size:.86rem;color:var(--muted);padding:18px 16px 18px;background:var(--surface);border:1px solid var(--line);border-radius:16px}
.path li:nth-child(6n+1){background:var(--tan-soft)}
.path li:nth-child(6n+2){background:var(--teal-soft)}
.path li:nth-child(6n+3){background:var(--copper-soft)}
.path li:nth-child(6n+4){background:var(--tan-soft)}
.path li:nth-child(6n+5){background:var(--teal-soft)}
.path li:nth-child(6n+6){background:var(--copper-soft)}
.path b{display:block;font-family:var(--serif);font-size:1.9rem;font-weight:600;color:var(--brown);line-height:1;margin-bottom:10px}
.path strong{display:block;color:var(--ink);font-weight:700;font-size:.95rem}
@media (max-width:900px){.path{grid-template-columns:repeat(3,1fr)}}
@media (max-width:520px){.path{grid-template-columns:repeat(2,1fr)}}

.split{display:grid;grid-template-columns:minmax(0,260px) 1fr;gap:48px;align-items:center;margin-top:30px}
.split.rev{grid-template-columns:1fr minmax(0,300px)}
.split img{border-radius:10px;box-shadow:var(--shadow)}
.arch{border-radius:200px 200px 16px 16px!important}
@media (max-width:680px){.split,.split.rev{grid-template-columns:1fr;gap:28px}.split img{max-width:240px}}
.quote-book{font-family:var(--serif);font-size:1.42rem;font-style:italic;line-height:1.4;color:var(--brown);border-left:2px solid var(--caramel);padding-left:20px;margin:22px 0}

.note{background:var(--teal-soft);padding:16px 20px;border-radius:14px;margin:20px 0;font-size:.94rem;display:grid;gap:4px}
.note.amber{background:var(--copper-soft)}
.note p:last-child{margin:0}

/* Biblioteca */
.cat{margin-top:44px}
.cat-head{display:flex;align-items:center;gap:12px;margin-bottom:4px}
.cat-head .sw{width:14px;height:14px;border-radius:4px;flex:none;background:var(--cat)}
.cat h2{margin:0}
.cat .muted{margin:0 0 18px}
.library{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr))}
.m-card{--cat:var(--caramel);--cat-soft:var(--tan-soft);background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px 24px 20px;text-decoration:none;color:var(--ink);display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden;transition:transform .2s,box-shadow .2s,border-color .2s}
.m-card::before{content:"";position:absolute;right:-40px;top:-40px;width:120px;height:120px;border-radius:50%;background:var(--cat-soft)}
.m-card>*{position:relative}
.m-card h3{margin:0;font-family:var(--serif);font-weight:600;font-size:1.6rem;line-height:1.1}
.m-card p{margin:0;color:var(--muted);font-size:.93rem}
.m-card .go{margin-top:auto;padding-top:10px;font-size:.84rem;font-weight:700;color:var(--brown)}
.m-card:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--cat)}
.cat-crencas{--cat:var(--sage);--cat-soft:var(--teal-soft)}
.cat-emocoes{--cat:var(--copper);--cat-soft:var(--copper-soft)}
.cat-relacoes{--cat:var(--caramel);--cat-soft:var(--tan-soft)}
.flag{align-self:flex-start;font-size:.7rem;font-weight:700;letter-spacing:.04em;color:var(--copper);background:var(--copper-soft);border-radius:99px;padding:3px 10px}

/* Metáfora */
.back{font-size:.86rem;color:var(--muted);text-decoration:none;display:inline-flex;gap:6px;margin-bottom:14px;font-weight:600}
.back::before{content:"←"}
.back:hover{color:var(--brown)}
.m-head h1{font-size:clamp(2.3rem,5.4vw,3.4rem)}
.journey{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 14px;margin:18px 0 30px;scrollbar-width:thin}
.journey a{flex:none;display:flex;align-items:center;gap:9px;text-decoration:none;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:6px 16px 6px 6px;font-size:.85rem;font-weight:600;background:var(--surface)}
.journey a:hover{color:var(--ink);border-color:var(--caramel)}
.journey a i{font-style:normal;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--tan-soft);font-size:.76rem;font-weight:800;color:var(--brown)}
.journey a[aria-current="step"]{color:var(--ink);border-color:var(--brown);background:var(--tan-soft)}
.journey a[aria-current="step"] i{background:var(--brown);color:var(--on-brown)}

.story{font-family:var(--serif);font-size:1.34rem;line-height:1.7;padding:6px 0 6px 28px;margin:6px 0 24px;max-width:62ch;border-left:1px solid var(--caramel)}
.story p{margin:0 0 1em}
.story>p:first-child::first-letter{font-size:3.4em;float:left;line-height:.82;padding:8px 10px 0 0;color:var(--copper);font-weight:600}
.story .fala{margin:0 0 1em;padding-left:1em;font-style:italic;color:var(--brown)}
.pendente{font-family:var(--sans);font-size:.86rem!important;background:var(--copper-soft);color:var(--brown);padding:8px 12px;border-radius:8px;border:1px dashed var(--copper)}
.origem{font-size:.84rem;color:var(--muted);font-style:italic}
.message{font-family:var(--serif);font-size:1.45rem;font-style:italic;line-height:1.45;max-width:58ch;margin:0;color:var(--brown)}

.block{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:6px 26px 20px;margin:20px 0}
.block>h3:first-child{margin-top:18px}
.block ul{margin:0;padding-left:1.2em}
.block li{margin:.45em 0}
.block li::marker{color:var(--sage)}
details.lens{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin:10px 0;padding:0 22px}
details.lens[open]{border-color:var(--caramel)}
details.lens summary{cursor:pointer;padding:16px 0;font-weight:700;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:12px}
details.lens summary::-webkit-details-marker{display:none}
details.lens summary::after{content:"+";display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--tan-soft);color:var(--brown);font-size:1.1rem;line-height:1;flex:none}
details.lens[open] summary::after{content:"–"}
.lens-body{padding-bottom:14px}
.lens-body p{max-width:66ch}

ol.steps{counter-reset:s;list-style:none;padding:0;margin:12px 0}
ol.steps li{counter-increment:s;position:relative;padding:14px 0 14px 54px;border-bottom:1px solid var(--line);max-width:70ch}
ol.steps li::before{content:counter(s);position:absolute;left:0;top:12px;width:36px;height:36px;border-radius:50%;background:var(--tan-soft);color:var(--brown);display:grid;place-items:center;font-family:var(--serif);font-weight:700;font-size:1.15rem}
ol.steps strong{display:block}
.qlist{padding-left:1.2em;max-width:70ch}
.qlist li{margin:.5em 0}
.qlist li::marker{color:var(--copper)}
.risk{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:6px 22px 14px;margin:12px 0}
.risk h3{margin-top:14px;color:var(--copper)}
.risk p:last-child,.risk .fala:last-child{margin-bottom:4px}
.fala{font-family:var(--serif);font-style:italic;font-size:1.22rem;line-height:1.45;color:var(--brown);margin:10px 0 14px;padding-left:16px;border-left:2px solid var(--beige);max-width:64ch}
.case{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 28px}
.case p{max-width:68ch}
.fict{font-size:.84rem;color:var(--muted);font-style:italic;margin:10px 0 0!important}

.ap-step{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:6px 26px 20px;margin:16px 0}
.ap-step h3{margin-top:16px;font-family:var(--serif);font-size:1.4rem;font-weight:600;color:var(--brown)}
.ap-step ul{padding-left:1.2em}
.complete{font-family:var(--serif);font-style:italic;color:var(--brown);margin:0 0 6px}
.final{border-top:1px solid var(--caramel);margin-top:30px;padding-top:16px;font-family:var(--serif);font-size:1.3rem;line-height:1.5;max-width:62ch}
.final .sign{font-family:var(--sans);font-size:.94rem}

.field{margin:0 0 20px}
.field label{display:block;font-weight:700;margin-bottom:4px}
.field .hint{display:block;font-size:.84rem;color:var(--muted);margin-bottom:6px;font-weight:400}
textarea,input[type=text]{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:12px 14px;line-height:1.5;transition:border-color .15s,box-shadow .15s}
textarea{min-height:96px;resize:vertical}
textarea:focus,input[type=text]:focus{border-color:var(--copper);outline:none;box-shadow:0 0 0 3px var(--copper-soft)}
.checks{list-style:none;padding:0;margin:0}
.checks label{display:flex;gap:10px;align-items:flex-start;padding:8px 0;font-weight:400;cursor:pointer}
.checks input{margin-top:5px;accent-color:var(--brown);width:18px;height:18px;flex:none}
.saved{font-size:.84rem;color:var(--teal);min-height:1.3em;font-weight:700}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:10px 0 24px}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 18px;font-weight:700;color:var(--muted);cursor:pointer;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--brown);border-color:var(--brown)}
.reg-list{display:grid;gap:12px;margin-top:18px}
.reg{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.reg h3{margin:0;font-family:var(--serif);font-size:1.35rem;font-weight:600}
.reg .meta{font-size:.84rem;color:var(--muted)}
.status{display:inline-block;font-size:.72rem;font-weight:700;border-radius:99px;padding:3px 10px;background:var(--bg);border:1px solid var(--line);color:var(--muted);margin-right:4px}
.status.ok{background:var(--teal-soft);border-color:transparent;color:var(--teal)}
.empty{border:1.5px dashed var(--beige);border-radius:18px;padding:26px;color:var(--muted);background:var(--surface)}

.share-sheet{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:34px 36px;max-width:70ch;box-shadow:var(--shadow)}
.share-sheet h2{margin-top:0;font-size:2.1rem}
.share-sheet .story{font-size:1.2rem}
@media (max-width:520px){.share-sheet,.case{padding:22px 20px}.block,.ap-step{padding-inline:20px}}

.session{position:fixed;inset:0;z-index:50;background:#2B221B;color:#F3EAE0;overflow:auto;padding:calc(28px + env(safe-area-inset-top,0px)) 24px calc(28px + env(safe-area-inset-bottom,0px))}
.session-in{max-width:760px;margin:0 auto}
.session h2{color:#D6B686;margin-top:0;font-size:2.4rem}
.session ol,.session ul{font-size:1.25rem;line-height:1.55;padding-left:1.3em}
.session li{margin:.6em 0}
.session .own{border-top:1px solid #4A3B2F;margin-top:24px;padding-top:14px}
.session .btn{background:#F3EAE0;color:#2B221B;border-color:#F3EAE0}

.site-foot{max-width:1080px;margin:0 auto;padding:28px 24px 40px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between;font-size:.82rem;color:var(--muted)}
@media (max-width:820px){.site-foot{padding-bottom:96px}}

<!-- ================= ELEFANTE ================= -->
<template id="elefante-historia">
<p>Você já observou um elefante no circo? Durante o espetáculo, o enorme animal faz demonstrações de força descomunais. Mas, antes de entrar em cena, permanece preso, quieto, contido somente por uma corrente que aprisiona uma de suas patas a uma pequena estaca cravada no solo.</p>
<p>A estaca é só um pequeno pedaço de madeira. E, ainda que a corrente fosse grossa, parece óbvio que ele, capaz de derrubar uma árvore com a própria força, poderia arrancá-la do solo e fugir com facilidade.</p>
<p>Que mistério! Por que o elefante não foge?</p>
<p>Há alguns anos, descobri que alguém havia sido bastante sábio para encontrar a resposta: <em>o elefante do circo não escapa porque foi preso à estaca ainda muito pequeno.</em></p>
<p>Fico imaginando o pequeno recém-nascido preso. Ele deve ter tentado sair e feito muita força. Apesar de todo o esforço, não conseguiu. A estaca devia ser muito pesada para ele. Ficou cansado e aceitou o destino.</p>
<p>Quando cresceu, não tentou mais se soltar e também não tinha noção da própria força.</p>
<p>Para que consiga quebrar a corrente, seria necessário que ocorresse algo fora do comum, como um incêndio. O medo do fogo faria com que o elefante, em desespero, quebrasse a corrente e fugisse.</p>
</template>
<template id="elefante-compreender">
<h2>Por que esta metáfora é importante</h2>
<p>Psi, essa metáfora é um coringa para compreender o desamparo aprendido e as crenças centrais que limitam nossos pacientes. É a história de alguém que, como o elefante, age como se ainda fosse fraco, mesmo tendo força hoje.</p>
<h2>Três lentes</h2>
<details class="lens"><summary>Terapia Cognitivo-Comportamental</summary><div class="lens-body"><p>Ilustra como pensamentos automáticos, crenças e regras disfuncionais podem persistir mesmo quando a realidade mudou. A “estaca” de hoje pode não ser a mesma do passado.</p></div></details>
<details class="lens"><summary>Terapia do Esquema</summary><div class="lens-body"><p>A corrente pode representar esquemas como Fracasso, Dependência/Incompetência, Abandono, Subjugação ou Padrões Rígidos. O padrão continua se repetindo porque, mesmo doloroso, tornou-se familiar.</p></div></details>
<details class="lens"><summary>Teoria do Apego</summary><div class="lens-body"><p>A corrente pode representar padrões relacionais e autoimagens negativas que oferecem uma falsa sensação de segurança ou previsibilidade. Romper com o conhecido pode despertar medo intenso da incerteza.</p></div></details>
<div class="block"><h3>Quando pode ser útil</h3><ul>
<li>A pessoa verbaliza crenças de incapacidade aprendidas, como “não adianta tentar”, “eu não consigo” ou “sempre dá errado”.</li>
<li>Existem generalização excessiva de fracassos antigos, rotulação de incapacidade e busca de evidências de que uma tentativa não dará certo.</li>
<li>Aparecem esquemas de Dependência/Incompetência, Fracasso, Padrões Rígidos ou Subjugação.</li>
<li>A pessoa não reconhece os recursos que possui hoje.</li>
<li>Há passividade, evitação, medo de tentar novamente ou permanência em rotinas conhecidas, mesmo quando já existem apoio e habilidades para experimentar algo diferente.</li>
<li>Aparecem frases como “só eu faço certo” ou “se eu delegar, vai dar errado”.</li>
</ul></div>
</template>
<template id="elefante-como">
<h2>Como introduzo e construo a ponte</h2>
<ol class="steps">
<li><strong>Conecto e introduzo.</strong> “Sabe, muitas vezes nos sentimos presos a algo. Lembrei-me de uma história potente: a do elefantinho.”</li>
<li><strong>Conto a metáfora.</strong> Narro a história destacando que ele não se solta porque acredita que não pode.</li>
<li><strong>Faço a ponte.</strong> “Faz sentido para você? Existe alguma corrente invisível em sua vida, algo que você acredita que ainda prende você?”</li>
<li><strong>Exploro pensamentos, crenças e esquemas.</strong> “Que verdades aparecem quando você pensa em fazer isso? Essa é uma crença antiga?”</li>
<li><strong>Valido o passado e observo o presente.</strong> Reconheço que aquela crença teve uma história, mas investigo se os recursos atuais são os mesmos de quando ela se formou.</li>
<li><strong>Proponho um pequeno puxão.</strong> “Que passo pequeno e seguro você poderia dar hoje para testar a força dessa corrente?”</li>
</ol>
<h2>O que pode dar errado e como contorno</h2>
<div class="risk"><h3>A pessoa fica presa à dor do passado</h3><p>Reconheço e valido a história, sem apressar uma conclusão. Depois, quando houver espaço, pergunto:</p><blockquote class="fala">“E você hoje? Que recursos possui para experimentar a força dessa corrente com segurança?”</blockquote></div>
<div class="risk"><h3>A limitação é real</h3><p>A metáfora pode frustrar ou culpabilizar se o obstáculo não for apenas uma crença. Nesse caso, valido os limites reais, sociais, relacionais e contextuais, e pergunto:</p><blockquote class="fala">“Qual parte dessa corrente está ao seu alcance afrouxar, mesmo que a estaca ainda seja grande?”</blockquote></div>
<div class="risk"><h3>A pessoa não se identifica</h3><p>Não tento convencer nem defender a metáfora. Posso dizer:</p><blockquote class="fala">“Sua situação é única. Existe alguma parte dessa história que conversa com você? Se não existir, podemos deixá-la de lado.”</blockquote></div>
<h2>Estudo de caso: Laura</h2>
<div class="case">
<p>Imagine uma paciente de 35 anos, advogada, com ansiedade de desempenho e perfeccionismo. Ela apresenta dificuldade intensa para delegar tarefas, sente que “só ela faz certo” e paralisa diante de erros próprios ou da equipe. Repete: “Tenho que fazer tudo. Se eu não fizer, ninguém fará direito. Já tentei delegar e só deu errado.”</p>
<p>Ela relata pais muito exigentes e perfeccionistas e se identifica com os esquemas de Padrões Rígidos/Critérios Inflexíveis e Autossacrifício.</p>
<p>Eu poderia dizer:</p>
<blockquote class="fala">“Laura, ouvindo você falar sobre essa sensação de precisar fazer tudo e sobre as frustrações ao tentar delegar, lembrei-me de uma história que talvez possa nos ajudar a pensar: a do elefante acorrentado.”</blockquote>
<p>Conto a metáfora com emoção e pausas, como se estivéssemos conversando em um banco de praça. Depois, pergunto:</p>
<blockquote class="fala">“O que você percebe nessa história que se conecta com esse ‘ter que fazer tudo’? Essa corrente de que ‘só eu faço certo’ ou ‘se eu delegar, dará errado’ é a mesma que prendeu você quando era mais jovem e dependia mais da aprovação ou do controle?”</blockquote>
<blockquote class="fala">“Quais recursos de elefante adulto você tem hoje para testar se essa corrente ainda prende você da mesma forma?”</blockquote>
<p>Isso pode abrir espaço para experimentar novas maneiras de delegar, flexibilizar o perfeccionismo, tolerar diferenças e compreender a relação entre controle, insegurança e necessidade de aprovação.</p>
<p class="fict">O caso é fictício, composto ou rigorosamente descaracterizado para fins educativos.</p>
</div>
</template>
<template id="elefante-perguntas">
<li>Qual foi a primeira corrente que convenceu você de que não conseguiria?</li>
<li>O que mudou de lá para cá?</li>
<li>Se você puxasse a corrente só um pouco hoje, por onde começaria?</li>
<li>Quem poderia apoiar você enquanto testa essa corrente?</li>
<li>O que você teme que aconteça se tentar?</li>
<li>Qual poderia ser o plano B se esse medo se confirmasse?</li>
<li>Quais recursos de “elefante adulto” você possui hoje?</li>
</template>
<template id="elefante-auto">
<p class="lead">Antes de utilizar esta metáfora, convido você a experimentá-la pessoalmente, especialmente em relação às limitações que percebe em sua prática clínica.</p>
<section class="ap-step"><h3>1. Identifique sua corrente profissional</h3><p>Em que área da sua prática você se sente presa por uma crença antiga?</p><ul><li>“Não posso fazer isso na sessão.”</li><li>“Não sou capaz de atender esse tipo de caso.”</li><li>“Se eu tentar, dará errado.”</li></ul><textarea class="ap" aria-label="Sua corrente profissional"></textarea></section>
<section class="ap-step"><h3>2. Reconheça quando essa corrente foi criada</h3><p>Que experiência pode ter amarrado você a essa crença? Uma supervisão crítica, um caso que não evoluiu, comparação com colegas, expectativas familiares ou acadêmicas, uma experiência de exposição, erro ou insegurança.</p><textarea class="ap" aria-label="Quando a corrente foi criada"></textarea></section>
<section class="ap-step"><h3>3. Liste seus recursos de elefante adulto</h3><p>Que formações, experiências, habilidades, relações e apoios você possui hoje e não possuía quando essa corrente foi criada? Que evidências mostram que você tem mais recursos agora?</p><textarea class="ap" aria-label="Seus recursos de elefante adulto"></textarea></section>
<section class="ap-step"><h3>4. Proponha um pequeno puxão</h3><p>Que passo pequeno e seguro você pode dar nesta semana para verificar se essa corrente ainda prende você da mesma forma? Por exemplo: experimentar uma intervenção nova, estudar e se preparar para um caso que costuma evitar, pedir apoio ou feedback a uma pessoa supervisora acolhedora, reconhecer que não precisa dominar tudo antes de começar.</p><textarea class="ap" aria-label="Seu pequeno puxão"></textarea></section>
<div class="final"><p><strong>Reflexão final.</strong> Quando você reconhece sua própria força e testa suas correntes invisíveis, pode ocupar a prática com mais consciência, humanidade e coragem, acompanhando também seus pacientes na construção dos próprios movimentos.</p></div>
</template>

<!-- ================= ESPELHO ================= -->
<template id="espelho-historia">
<p>Sabe quando a gente toma banho quente e o espelho fica todo embaçado?</p>
<p>A gente olha para o espelho e não consegue ver o rosto com nitidez. Tudo está borrado, distorcido, difícil de enxergar.</p>
<p>Às vezes, a forma como você está se enxergando agora é parecida com esse espelho embaçado. O vapor das experiências difíceis, das dores que você viveu e das críticas que ouviu foi embaçando esse espelho.</p>
<p>Agora, quando você se olha, não vê quem realmente é. Vê uma imagem distorcida, borrada, cheia de manchas.</p>
<p>Mas sabe o que acontece quando limpamos o espelho com cuidado? A imagem real começa a aparecer. Devagar, mas ela aparece. E você percebe que sempre esteve ali, apenas escondida pela névoa.</p>
<p>Aqui na terapia, vamos limpar esse espelho juntos: com cuidado, com afeto e sem pressa.</p>
<p>Aos poucos, você poderá se enxergar com mais clareza. Não apenas pela imagem distorcida que o sofrimento criou, mas a partir de quem você é.</p>
</template>
<template id="espelho-compreender">
<h2>Por que esta metáfora é importante</h2>
<p>Esta metáfora ajuda a trabalhar distorções de autoimagem e crenças centrais relacionadas a defectividade, vergonha, fracasso e inadequação. A pessoa pode estar olhando para si por meio de um “vapor” formado por dores, críticas, rejeições e experiências que passaram a filtrar sua autopercepção.</p>
<h2>Três lentes</h2>
<details class="lens"><summary>Terapia Cognitivo-Comportamental</summary><div class="lens-body"><p>O vapor representa filtros cognitivos, como rotulação e filtro mental negativo. Limpar o espelho envolve ampliar a percepção e buscar evidências que não confirmem apenas a imagem negativa.</p></div></details>
<details class="lens"><summary>Terapia do Esquema</summary><div class="lens-body"><p>O vapor pode representar esquemas de Defectividade/Vergonha, Fracasso ou Inadequação Social. A limpeza envolve reconhecer a origem e a manutenção desses padrões, com confronto empático e experiências reparadoras.</p></div></details>
<details class="lens"><summary>Teoria do Apego</summary><div class="lens-body"><p>O espelho embaçado pode representar um modelo interno negativo de si, formado em relações marcadas por rejeição, invalidação, imprevisibilidade ou abuso. A relação terapêutica segura pode oferecer um reflexo mais acolhedor, genuíno e realista.</p></div></details>
<div class="block"><h3>Quando pode ser útil</h3><ul>
<li>A pessoa verbaliza crenças rígidas como “sou um fracasso”, “não sirvo para nada” ou “há algo errado comigo”.</li>
<li>Há rotulação e filtro mental negativo sobre si.</li>
<li>Os esquemas de Defectividade/Vergonha, Fracasso ou Inadequação Social estão muito ativos.</li>
<li>Existe sentimento persistente de não ser digna de amor, aceitação ou pertencimento.</li>
<li>A pessoa relata não se reconhecer mais ou diz que não gosta do que vê quando olha para si.</li>
</ul></div>
</template>
<template id="espelho-como">
<h2>Como introduzo e construo a ponte</h2>
<ol class="steps">
<li><strong>Conecto e introduzo.</strong> “Sabe quando a gente toma banho quente e o espelho fica todo embaçado? Você olha e não consegue ver o rosto com nitidez…”</li>
<li><strong>Conto a metáfora.</strong> Narro a história destacando como experiências difíceis podem distorcer a forma de se perceber.</li>
<li><strong>Faço a ponte.</strong> “Faz sentido para você? Você sente que está se enxergando por meio desse vapor?”</li>
<li><strong>Exploro pensamentos e esquemas.</strong> “Que imagem aparece nesse espelho? De onde pode vir esse vapor? Que críticas, dores ou experiências ajudaram a formar essa névoa?”</li>
<li><strong>Valido o passado e observo o presente.</strong> Reconheço que a imagem se formou em uma história, mas investigo os recursos e evidências disponíveis hoje.</li>
<li><strong>Proponho uma pequena limpeza.</strong> “Que parte desse espelho poderia começar a ser limpa? Que evidência mostra quem você é além do que o vapor apresenta?”</li>
</ol>
<h2>O que pode dar errado e como contorno</h2>
<div class="risk"><h3>“O espelho sempre foi assim”</h3><p>Valido a força e a duração dessa percepção e convido para um movimento menor:</p><blockquote class="fala">“E se não precisássemos limpar tudo agora? Se fosse possível limpar apenas um pequeno canto, o que talvez aparecesse?”</blockquote></div>
<div class="risk"><h3>A pessoa fica presa à origem do vapor</h3><p>Acolho o passado sem apressar a saída e, quando houver espaço, pergunto:</p><blockquote class="fala">“E você hoje? Que recursos possui para começar a construir uma forma mais justa de se enxergar?”</blockquote></div>
<div class="risk"><h3>A pessoa não se identifica</h3><p>Não forço a analogia nem tento convencer:</p><blockquote class="fala">“Sua experiência é única. Existe alguma parte dessa imagem que conversa com você? Se não existir, podemos deixá-la de lado.”</blockquote></div>
<div class="risk"><h3>A metáfora vira positividade ou correção</h3><p>Evito substituir uma imagem negativa por elogios genéricos ou dizer quem a pessoa “realmente é”. A proposta é construir uma percepção mais ampla, realista e compassiva, sem apagar dores, limites e contradições.</p></div>
<h2>Estudo de caso: Maria</h2>
<div class="case">
<p>Imagine uma paciente de 28 anos, professora, que chega ao consultório dizendo: “Eu não me reconheço mais. Quando me olho no espelho, vejo alguém cansada, feia e sem valor. Não consigo ver nada de bom em mim.”</p>
<p>Ela apresenta sintomas depressivos e relata críticas constantes durante a infância, além de comparações negativas com a irmã mais velha. Os esquemas de Defectividade/Vergonha e Fracasso parecem estar ativados.</p>
<p>Eu poderia dizer:</p>
<blockquote class="fala">“Maria, ouvindo você falar sobre essa dificuldade de se enxergar e se reconhecer, veio à minha mente uma imagem que talvez faça sentido para você: a do espelho embaçado.”</blockquote>
<p>Conto a metáfora com pausas, permitindo que cada frase encontre espaço. Depois, pergunto:</p>
<blockquote class="fala">“O que você percebe nessa história que se conecta com o que está vivendo? De onde pode vir esse vapor? Que críticas e experiências criaram essa névoa?”</blockquote>
<blockquote class="fala">“Essa imagem de alguém cansada, feia e sem valor mostra tudo o que você é ou pode estar sendo influenciada pelo vapor? Que características, conquistas e recursos ainda estão presentes, mesmo que agora estejam difíceis de enxergar?”</blockquote>
<p>A paciente pode reconhecer que passou a se observar pelos olhos críticos de outras pessoas. Isso abre caminho para trabalhar as crenças, ampliar as evidências sobre si e construir um modelo interno mais seguro e compassivo, sem entregar uma interpretação fechada.</p>
<p class="fict">O caso é fictício, composto ou rigorosamente descaracterizado para fins educativos.</p>
</div>
</template>
<template id="espelho-perguntas">
<li>Faz sentido para você? Você sente que está se enxergando por meio desse vapor?</li>
<li>Que imagem aparece nesse espelho?</li>
<li>De onde pode vir esse vapor?</li>
<li>Que parte desse espelho poderia começar a ser limpa?</li>
<li>Se fosse possível limpar apenas um pequeno canto, o que talvez aparecesse?</li>
<li>Que características, conquistas e recursos ainda estão presentes, mesmo que agora estejam difíceis de enxergar?</li>
</template>
<template id="espelho-auto">
<p class="lead">Antes de utilizar esta metáfora, convido você a experimentá-la em relação às inseguranças que aparecem em sua prática clínica.</p>
<section class="ap-step"><h3>1. Identifique seu espelho embaçado profissional</h3><p>Em que área da prática você se vê de maneira distorcida? “Não sou boa o suficiente.” “Não sei o suficiente.” “Vou falhar com meus pacientes.”</p><textarea class="ap" aria-label="Seu espelho embaçado"></textarea></section>
<section class="ap-step"><h3>2. Reconheça o vapor</h3><p>Que experiências pessoais ou profissionais influenciaram essa imagem? Críticas recebidas em supervisão, comparações com colegas, casos que não evoluíram como esperado, expectativas internas rígidas ou irreais, experiências de exposição, rejeição ou insegurança.</p><textarea class="ap" aria-label="O vapor"></textarea></section>
<section class="ap-step"><h3>3. Busque evidências reais de sua competência</h3><ul><li>Que devolutivas positivas você já recebeu?</li><li>Que situações clínicas conduziu com cuidado?</li><li>Que mudanças acompanhou?</li><li>Quais formações, qualidades e recursos possui hoje?</li><li>O que o vapor costuma esconder quando você avalia a própria prática?</li></ul><textarea class="ap" aria-label="Evidências de competência"></textarea></section>
<section class="ap-step"><h3>4. Pratique um ato de limpeza profissional</h3><p>Que pequeno passo você pode dar nesta semana para se enxergar com mais clareza e compaixão? Por exemplo: reler uma devolutiva positiva, conversar com uma pessoa supervisora acolhedora, revisar um caso conduzido com responsabilidade, reconhecer uma conquista recente, aceitar uma limitação sem transformar isso em incapacidade.</p><textarea class="ap" aria-label="Ato de limpeza"></textarea></section>
<div class="final"><p><strong>Reflexão final.</strong> Quando você limpa seu próprio espelho clínico, reconhecendo competências reais e acolhendo suas limitações humanas, pode se tornar um espelho mais genuíno, seguro e acolhedor para seus pacientes.</p></div>
</template>

<!-- ================= RAIVA ================= -->
<template id="raiva-historia">
<p>Mariana ficou muito feliz porque ganhou um conjunto de chá azul com bolinhas amarelas. No dia seguinte, Júlia, sua amiga, chegou cedo para convidá-la para brincar. Mariana não poderia brincar naquela manhã porque sairia com a mãe.</p>
<p>Júlia pediu o conjunto emprestado para brincar sozinha na garagem do prédio. Mariana não queria emprestar, mas, diante da insistência da amiga, acabou cedendo, embora demonstrasse ciúme daquele brinquedo tão especial.</p>
<p>Quando voltou do passeio, Mariana ficou chocada ao encontrar o conjunto jogado no chão. Algumas xícaras haviam desaparecido e a bandeja estava quebrada. Chorando e muito nervosa, disse à mãe:</p>
<blockquote class="fala">“Está vendo, mamãe, o que a Júlia fez comigo? Emprestei meu brinquedo, ela estragou tudo e ainda deixou jogado no chão.”</blockquote>
<p>Mariana queria ir imediatamente ao apartamento de Júlia pedir explicações. Com carinho, a mãe perguntou:</p>
<blockquote class="fala">“Filhinha, lembra do dia em que você saiu com o vestido branco novo e um carro jogou lama em sua roupa? Quando chegou em casa, queria lavar tudo imediatamente, mas a vovó pediu para deixar o barro secar primeiro. Depois seria mais fácil limpar.”</blockquote>
<p>Então, explicou:</p>
<blockquote class="fala">“Com a raiva pode acontecer algo parecido. Primeiro, deixamos a intensidade diminuir. Depois, conseguimos compreender e resolver melhor o que aconteceu.”</blockquote>
<p>Mariana não entendeu completamente, mas decidiu esperar. Pouco depois, a campainha tocou. Era Júlia, constrangida, com um embrulho nas mãos.</p>
<p class="pendente">Trecho a completar: a fala de Júlia neste ponto, conforme o texto original.</p>
<p>Mariana respondeu:</p>
<blockquote class="fala">“Não tem problema. Minha raiva já secou.”</blockquote>
<p>Depois, levou a amiga ao quarto e contou a história do vestido branco que havia sido sujo de barro.</p>
</template>
<template id="raiva-mensagem">A raiva pode dificultar a percepção e favorecer atitudes impulsivas. Criar uma pausa antes de agir pode ajudar a compreender a situação e escolher uma resposta mais ponderada. Depois que a intensidade diminui, ainda é necessário voltar ao que aconteceu e buscar uma resolução.</template>
<template id="raiva-compreender">
<h2>Por que esta metáfora é importante</h2>
<p>Psi, essa metáfora é uma imagem potente para trabalhar regulação emocional, especialmente quando a raiva aparece como explosão, impulsividade, ruminação ou repressão. A história do barro no vestido convida à pausa, à observação da emoção e à escolha consciente da resposta.</p>
<h2>Três lentes</h2>
<details class="lens"><summary>Terapia Cognitivo-Comportamental</summary><div class="lens-body"><p>Ajuda a diferenciar emoção, pensamento e ação. No auge da ativação, a interpretação pode ficar mais rígida e reativa. A pausa favorece reavaliação cognitiva, identificação de alternativas e escolha de uma resposta comportamental mais eficaz.</p></div></details>
<details class="lens"><summary>Terapia do Esquema</summary><div class="lens-body"><p>Pode ajudar a compreender padrões de Inibição Emocional, Impulsividade/Autocontrole Insuficiente, Privação Emocional e sensibilidades relacionadas à injustiça. A proposta não é suprimir a raiva, mas reconhecer necessidades e expressá-las de maneira construtiva.</p></div></details>
<details class="lens"><summary>Teoria do Apego</summary><div class="lens-body"><p>Permite observar como a raiva é utilizada nas relações. Algumas pessoas intensificam a emoção para obter resposta e proximidade; outras a escondem para evitar conflito ou afastamento. A pausa pode favorecer segurança interna e proteção dos vínculos sem abandonar a própria necessidade.</p></div></details>
<div class="block"><h3>Quando pode ser útil</h3><ul>
<li>A pessoa apresenta explosões de raiva ou comportamentos impulsivos.</li>
<li>Existe arrependimento frequente depois de reagir.</li>
<li>A raiva é ruminada e se transforma em ressentimento persistente.</li>
<li>Há dificuldade de reconhecer sinais iniciais de ativação.</li>
<li>O trabalho clínico envolve regulação emocional ou resolução de conflitos.</li>
<li>A pessoa precisa aprender a pausar sem ignorar o problema.</li>
</ul></div>
</template>
<template id="raiva-como">
<h2>Como introduzo e construo a ponte</h2>
<ol class="steps">
<li><strong>Valido a emoção.</strong> “A raiva é uma emoção intensa, e é compreensível sentir vontade de agir no calor do momento.”</li>
<li><strong>Apresento a metáfora.</strong> “Lembrei-me de uma história sobre Mariana e o barro no vestido que pode nos ajudar a pensar sobre essa emoção.”</li>
<li><strong>Faço a ponte.</strong> “Em que parte você se identifica com Mariana? O que costuma acontecer quando sua raiva começa a secar?”</li>
<li><strong>Exploro as consequências.</strong> “O que poderia ter acontecido se Mariana tivesse procurado Júlia no auge da raiva? E o que costuma acontecer quando você age nesse ponto?”</li>
<li><strong>Reconheço os sinais.</strong> Identificamos juntos mudanças no corpo, pensamentos, impulsos e comportamentos que mostram a raiva aumentando.</li>
<li><strong>Construo o Plano do Barro.</strong> Definimos uma pausa possível e uma forma de retomar a situação depois.</li>
</ol>
<div class="block"><h3>Plano do Barro</h3><ul>
<li>Como percebo que minha raiva está aumentando?</li>
<li>De quanto tempo ou distância preciso para recuperar escolha?</li>
<li>O que ajuda meu corpo a reduzir a ativação?</li>
<li>Como posso comunicar que preciso de uma pausa sem abandonar a conversa?</li>
<li>Quando e como retomarei o problema?</li>
<li>O que preciso expressar, pedir, proteger ou reparar?</li>
</ul><p style="margin-top:12px">Possibilidades de pausa podem incluir respirar, caminhar, beber água, escrever antes de falar, sair temporariamente do ambiente ou procurar alguém que ajude na regulação. A estratégia deve ser escolhida de acordo com a pessoa, o contexto e a segurança.</p></div>
<h2>O que pode dar errado e como contorno</h2>
<div class="risk"><h3>A metáfora vira fuga ou supressão</h3><p>“Deixar secar” não significa ignorar, engolir ou evitar indefinidamente. Depois da pausa, é necessário retornar ao problema, compreender a necessidade e decidir como agir.</p><blockquote class="fala">“Depois que o barro seca, ainda precisamos limpar. Como você poderá retomar essa situação de maneira mais segura e clara?”</blockquote></div>
<div class="risk"><h3>A pessoa sente que sua raiva foi invalidada</h3><p>Reforço que a raiva pode sinalizar injustiça, invasão de limites, frustração, dor ou necessidade não atendida.</p><blockquote class="fala">“Não estamos tentando impedir você de sentir raiva. Estamos criando espaço para que a raiva informe, sem decidir sozinha o que você fará.”</blockquote></div>
<div class="risk"><h3>Há desregulação emocional intensa</h3><p>A pausa pode não ser suficiente sem treino, apoio e estratégias adicionais. Começo com objetivos pequenos, ensaio em sessão e valorizo tentativas parciais de interromper o piloto automático.</p></div>
<div class="risk"><h3>Existe risco ou violência</h3><p>A metáfora não deve ser utilizada para incentivar permanência silenciosa em situações de abuso, ameaça ou perigo. Segurança, proteção e busca de apoio têm prioridade. Pausar não significa tolerar violência nem deixar de estabelecer limites.</p></div>
<h2>Estudo de caso: cenário clínico</h2>
<div class="case">
<p>Imagine uma pessoa de 32 anos que procura terapia devido a conflitos nos relacionamentos e explosões de raiva no trabalho e em casa. Ela relata:</p>
<blockquote class="fala">“Eu não consigo me controlar. Quando percebo, já estou gritando. Depois me arrependo muito.”</blockquote>
<p>Podem aparecer períodos prolongados de contenção seguidos por explosão, necessidades emocionais não comunicadas e tentativas intensas de obter atenção, reparação ou reconhecimento.</p>
<p>Eu poderia dizer:</p>
<blockquote class="fala">“Essa sensação de perder o controle quando a raiva chega é muito difícil. Parece que a emoção toma todo o espaço e reduz nossa capacidade de escolher. Lembrei-me de uma história sobre Mariana e o barro no vestido. Posso contar?”</blockquote>
<p>Depois da narrativa, pergunto:</p>
<blockquote class="fala">“O que você percebe nessa história que se conecta às suas situações de raiva? Se a raiva fosse a lama, o que ajudaria você a criar uma pausa antes de agir?”</blockquote>
<p>A partir daí, mapeamos gatilhos, sinais físicos e pensamentos iniciais e construímos o Plano do Barro. O objetivo não é eliminar a raiva, mas ampliar a capacidade de perceber, regular, comunicar e retomar o conflito com mais segurança.</p>
<p class="fict">O caso é fictício, composto ou rigorosamente descaracterizado para fins educativos.</p>
</div>

<!-- ================= CAFÉ ================= -->
<template id="cafe-historia">
<p>Um filho se queixou ao pai sobre a própria vida e sobre como tudo estava difícil. Já não sabia o que fazer, estava cansado de lutar e pensava em desistir. Parecia que, assim que um problema era resolvido, outro surgia.</p>
<p>Seu pai, que era chef, levou-o até a cozinha. Encheu três panelas com água e colocou-as em fogo alto. Quando começaram a ferver, colocou cenouras em uma, ovos em outra e pó de café na última. Deixou tudo ferver sem dizer uma palavra.</p>
<p>Cerca de vinte minutos depois, apagou o fogo. Retirou as cenouras, os ovos e o café, colocando cada um em uma tigela. Então perguntou:</p>
<blockquote class="fala">“Querido, o que você está vendo?”</blockquote>
<blockquote class="fala">“Cenouras, ovos e café”, respondeu o filho.</blockquote>
<p>O pai pediu que ele experimentasse as cenouras. Estavam macias. Depois, pediu que quebrasse um ovo. Por dentro, havia endurecido. Por fim, pediu que provasse o café e percebesse seu aroma.</p>
<p>O pai explicou que os três haviam enfrentado a mesma adversidade, a água fervente, mas cada um havia respondido de maneira diferente.</p>
<p>A cenoura entrou forte, firme e inflexível, mas amoleceu e ficou frágil. O ovo entrou delicado, protegido apenas pela casca, mas seu interior endureceu. O café, por sua vez, transformou a água.</p>
<p>Então perguntou:</p>
<blockquote class="fala">“Quando a adversidade bate à sua porta, como você costuma responder? Como a cenoura, como o ovo ou como o café?”</blockquote>
</template>
<template id="cafe-mensagem">Diante da dor, a cenoura pode perder energia, estrutura e esperança. O ovo pode endurecer, fechar-se, tornar-se rígido ou amargo. O café pode construir uma resposta que transforme a experiência e produza novos sentidos, recursos ou movimentos. Não existe obrigação de “ser café”: são imagens de estados e estratégias, não rótulos sobre quem a pessoa é.</template>
<template id="cafe-compreender">
<h2>Por que esta metáfora é importante</h2>
<p>Psi, essa metáfora é um convite para refletir sobre resiliência, enfrentamento e crescimento diante das adversidades. Ela ajuda a pessoa a observar como costuma reagir quando “a água ferve”, sem transformar essas respostas em identidades fixas.</p>
<div class="note amber"><p><strong>Cuidado central.</strong> Não existe obrigação de “ser café”. Cenoura, ovo e café são imagens de estados e estratégias, não rótulos sobre quem a pessoa é. Em determinados momentos, recuar, descansar ou se proteger também pode ser necessário.</p></div>
<h2>Três lentes</h2>
<details class="lens"><summary>Terapia Cognitivo-Comportamental</summary><div class="lens-body"><p>Permite explorar pensamentos automáticos, crenças sobre capacidade e padrões de enfrentamento. A pessoa pode reconhecer colapso, rigidez ou respostas mais flexíveis e construir estratégias de coping coerentes com a situação.</p></div></details>
<details class="lens"><summary>Terapia do Esquema</summary><div class="lens-body"><p>Pode ajudar a compreender Vulnerabilidade ao Dano ou à Doença, Fracasso, Padrões Inflexíveis e Punitividade, além dos modos de rendição, evitação e hipercompensação ativados diante da adversidade.</p></div></details>
<details class="lens"><summary>Teoria do Apego</summary><div class="lens-body"><p>Favorece a observação de estratégias relacionais diante do estresse. Algumas pessoas intensificam a busca por apoio e se desorganizam; outras endurecem e afastam a vulnerabilidade. Uma resposta mais segura inclui pedir ajuda, regular emoções e preservar a capacidade de escolha.</p></div></details>
<div class="block"><h3>Quando pode ser útil</h3><ul>
<li>A pessoa enfrenta crise, perda, rejeição, mudança ou adversidade significativa.</li>
<li>Relata que “não aguenta mais” ou que desmorona diante das dificuldades.</li>
<li>Desenvolveu rigidez, cinismo, isolamento ou amargura após experiências dolorosas.</li>
<li>O trabalho envolve resiliência, flexibilidade psicológica ou crescimento pós-traumático.</li>
<li>Precisa resgatar recursos internos e possibilidades de escolha.</li>
<li>O momento clínico permite reflexão sem apressar o luto ou a estabilização.</li>
</ul></div>
</template>
<template id="cafe-como">
<h2>Como introduzo e construo a ponte</h2>
<ol class="steps">
<li><strong>Valido o esgotamento.</strong> “É exaustivo enfrentar uma dificuldade depois da outra. Parece que, quando algo se resolve, outra coisa aparece.”</li>
<li><strong>Peço permissão.</strong> “Lembrei-me de uma história que pode nos ajudar a pensar sobre como reagimos aos ‘caldeirões’ da vida. Posso contar?”</li>
<li><strong>Apresento a metáfora.</strong> Conto a história com pausas para que a pessoa visualize cada transformação.</li>
<li><strong>Exploro sem julgar.</strong> “Neste momento, você se percebe mais como cenoura, ovo ou café? O que costuma acontecer quando a água ferve?”</li>
<li><strong>Investigo a função.</strong> “Como essa resposta tenta proteger você? O que ela ajuda e o que ela dificulta?”</li>
<li><strong>Resgato recursos.</strong> “Você se lembra de uma situação difícil em que respondeu de maneira diferente? O que ajudou naquela ocasião?”</li>
<li><strong>Construo um pequeno movimento.</strong> “Qual atitude possível poderia produzir um pouco mais de escolha nesta semana?”</li>
</ol>
<h2>O que pode dar errado e como contorno</h2>
<div class="risk"><h3>Invalidação da dor</h3><p>A pessoa pode sentir que está sendo pressionada a encontrar aprendizagem ou crescimento enquanto ainda sofre.</p><blockquote class="fala">“Não estamos tentando apagar a dor nem encontrar um lado positivo à força. Primeiro, quero compreender e acolher o que essa experiência está exigindo de você.”</blockquote></div>
<div class="risk"><h3>Culpabilização</h3><p>Evito apresentar a cenoura como fraqueza, o ovo como falha e o café como resposta moralmente superior.</p><blockquote class="fala">“Essas imagens mostram respostas possíveis, não definem seu valor. Podemos entender seu padrão com curiosidade e procurar mais escolhas, sem culpa.”</blockquote></div>
<div class="risk"><h3>Positividade tóxica</h3><p>Ser café não significa estar feliz, agradecer pelo trauma ou transformar toda dor em sucesso. Tristeza, luto, raiva e necessidade de descanso podem fazer parte do processo.</p></div>
<div class="risk"><h3>Trauma recente ou crise aguda</h3><p>Quando a experiência é muito recente, a prioridade pode ser estabilização, segurança, apoio e regulação. A metáfora deve esperar se estiver antecipando uma elaboração para a qual a pessoa ainda não tem condições.</p></div>
<div class="risk"><h3>Obstáculos reais</h3><p>Nem toda água pode ser transformada individualmente. Reconheço limitações sociais, econômicas, relacionais, de saúde e de acesso. A intervenção não deve responsabilizar a pessoa pelo contexto que a fere.</p></div>
<div class="risk"><h3>Esquemas muito rígidos</h3><p>Se a ideia de transformação parecer impossível, não forço. Investigo:</p><blockquote class="fala">“O que torna essa possibilidade tão distante agora? Que experiência ou crença bloqueia esse movimento? De que apoio você precisaria primeiro?”</blockquote></div>
<h2>Estudo de caso: Carla</h2>
<div class="case">
<p>Carla, 34 anos, gerente de projetos em uma empresa de tecnologia, procura terapia depois de não receber uma promoção aguardada havia dois anos. Relata sentir-se destruída, sem energia e incapaz. Apresenta desânimo, choro, insônia, pensamentos de fracasso, alta necessidade de validação e histórico familiar de cobrança com pouca validação emocional.</p>
<p>Na quarta sessão, diz:</p>
<blockquote class="fala">“Ana, não aguento mais. Sempre que algo dá errado, eu desmorono. Não consigo lidar com frustração. Será que sou fraca?”</blockquote>
<p>Primeiro, valido:</p>
<blockquote class="fala">“Carla, não receber essa promoção depois de tanto esforço é realmente doloroso. Você não é fraca. Você está sofrendo, e isso é diferente.”</blockquote>
<p>Depois, peço permissão para contar a história da cenoura, do ovo e do café. Ao final, pergunto:</p>
<blockquote class="fala">“Se você se identificasse com uma dessas imagens neste momento, qual seria?”</blockquote>
<p>Carla se reconhece como cenoura: começa confiante, mas perde estrutura quando enfrenta pressão ou frustração. Exploramos como esse padrão aparece em paralisação, desistência, isolamento e pensamentos de incompetência.</p>
<p>Conecto o padrão à história sem impor uma explicação:</p>
<blockquote class="fala">“Pode ser que essa adversidade ative uma crença antiga de não ser boa o suficiente. Quando essa crença aparece, desistir pode funcionar como uma forma de evitar novas críticas. Isso conversa com sua experiência?”</blockquote>
<p>Depois, apresento o café como possibilidade, e não exigência:</p>
<blockquote class="fala">“Se fosse possível produzir algum movimento novo a partir dessa experiência, sem negar a dor, o que isso significaria para você?”</blockquote>
<p>Carla considera pedir feedback, identificar competências a desenvolver e buscar formação. Resgatamos uma situação da faculdade em que ela buscou monitoria, formou um grupo de estudos e concluiu o curso. Essa lembrança oferece evidências de recursos já utilizados.</p>
<h3>Plano prático</h3>
<p>Carla escolhe marcar uma conversa com a gestora, pedir feedback específico, pesquisar um curso de liderança e observar quando pensamentos de fracasso a convidam a desistir.</p>
<h3>Desdobramentos</h3>
<p>Nas sessões seguintes, Carla obtém feedback, inicia uma formação e passa a usar a imagem para reconhecer momentos de colapso. Em uma nova oportunidade profissional, não recebe a promoção, sente tristeza, mas consegue pedir informações, identificar próximos passos e preservar sua continuidade.</p>
<h3>Por que a metáfora ajudou</h3>
<ul><li>A dor foi validada antes da metáfora.</li><li>O momento permitia reflexão.</li><li>A imagem foi conectada a recursos reais.</li><li>Houve plano de ação concreto.</li><li>A dificuldade de “ser café” foi normalizada.</li><li>A metáfora foi integrada ao trabalho clínico, e não usada isoladamente.</li></ul>
<p class="fict">O caso é fictício, composto ou rigorosamente descaracterizado para fins educativos.</p>
</div>

<section class="ap-step"><h3>4. Imagine uma resposta café</h3><p>Feche os olhos por um momento e imagine uma resposta que não exija negar a dor nem manter o padrão automático. O que significaria ser café nesta situação específica? Em que situação passada você já mobilizou recursos diante da adversidade? Que recurso daquela experiência pode ser retomado agora?</p><p class="complete">Se eu experimentasse uma resposta café nesta situação, eu poderia…</p><textarea class="ap" aria-label="Resposta café"></textarea></section>
<section class="ap-step"><h3>5. Defina uma ação concreta</h3><p>Escolha apenas uma ação pequena, específica e possível para esta semana. Defina quando, onde, com quem e qual será o primeiro passo.</p><p class="complete">Meu compromisso café para esta semana é…</p><textarea class="ap" aria-label="Compromisso café"></textarea></section>
<section class="ap-step"><h3>6. Conecte com suas crenças e esquemas</h3><ul><li>Que crença é ativada por essa água fervente?</li><li>O padrão cenoura ou ovo tenta proteger você de quê?</li><li>Quando você aprendeu a responder assim?</li><li>O que diria hoje à sua versão mais jovem?</li><li>De que apoio seu Modo Adulto Saudável precisa?</li></ul><textarea class="ap" aria-label="Crenças e esquemas"></textarea></section>
<section class="ap-step"><h3>7. Pratique autocompaixão</h3><p>Coloque a mão no coração e diga a si:</p><blockquote class="fala">“Eu não sou cenoura, ovo ou café. Sou humana. Às vezes vou amolecer, às vezes vou endurecer. Posso reconhecer isso com gentileza e experimentar algo novo quando estiver pronta.”</blockquote></section>
<section class="ap-step"><h3>8. Faça um registro durante a semana</h3><p>Quando perceber amolecimento ou endurecimento, anote a situação, o padrão percebido, o pensamento automático, a emoção e sua intensidade, a necessidade presente, como respondeu e como gostaria de responder numa próxima oportunidade.</p><textarea class="ap" aria-label="Registro da semana"></textarea></section>
<section class="ap-step"><h3>Check-in semanal</h3><ul><li>Consegui realizar meu compromisso?</li><li>Se não, o que dificultou?</li><li>Houve algum momento em que respondi de modo mais flexível sem perceber?</li><li>O que aprendi sobre mim?</li><li>Preciso de descanso, suporte, terapia ou supervisão?</li></ul><textarea class="ap" aria-label="Check-in semanal"></textarea></section>
<div class="note amber"><p>Se esta autoprática mobilizar algo muito intenso ou doloroso, considere levar o conteúdo para sua terapia ou supervisão. Psicólogas também merecem apoio profissional.</p></div>
<div class="final"><p>Você não precisa ser café o tempo todo. Em alguns momentos, amolecer pode sinalizar necessidade de descanso; endurecer pode ser uma proteção temporária. O objetivo é reconhecer o padrão e ampliar escolhas com gentileza, quando houver segurança e recursos.</p><p class="sign">Com carinho e admiração pelo seu trabalho,<br><strong>Ana Paula Costa</strong></p></div>
</template>

<template id="passaro-historia">
<p>Era uma vez uma menina que tinha um pássaro encantado como seu melhor amigo. Diferentemente dos pássaros comuns, ele voava livre e voltava quando sentia saudade.</p>
<p>As penas do pássaro mudavam de cor conforme os lugares por onde passava. Algumas vezes voltava branco, trazendo histórias de montanhas cobertas de neve. Em outras, retornava vermelho como o fogo, trazendo canções de terras quentes e marcadas pela seca. A menina amava ouvi-lo e adormecia imaginando que viajava em suas asas.</p>
<p>O pássaro também amava a menina e sempre voltava. Porém, chegava o momento em que precisava partir.</p>
<blockquote class="fala">“Por favor, não vá. Ficarei triste, sentirei saudade e vou chorar”, dizia a menina.</blockquote>
<blockquote class="fala">“Eu também sentirei saudade”, respondia o pássaro. “Mas meu encanto precisa da liberdade e da saudade. Se eu não partir, não existirá reencontro.”</blockquote>
<p>A menina sofria enquanto esperava. Em uma dessas noites, teve a ideia de prender o pássaro para que ele nunca mais a deixasse. Comprou uma linda gaiola e, quando ele retornou cansado de sua viagem, fechou-o cuidadosamente enquanto dormia.</p>
<p>Ao despertar, o pássaro lamentou:</p>
<blockquote class="fala">“Menina, o que você fez? Sem liberdade, o encanto se quebrará. Minhas penas perderão as cores e minhas histórias desaparecerão.”</blockquote>
<p>A menina acreditou que ele se acostumaria. Mas, com o tempo, as plumas caíram, as cores se tornaram cinzentas e o canto silenciou. O pássaro já não parecia aquele que ela amava, e a menina também se entristeceu.</p>
<p>Quando não suportou mais vê-lo daquela maneira, abriu a gaiola:</p>
<blockquote class="fala">“Pode ir. Volte quando quiser.”</blockquote>
<p>O pássaro agradeceu e explicou que precisava partir para poder sentir vontade de voltar. A distância e a saudade poderiam permitir que novas histórias, cores e experiências crescessem nos dois.</p>
<p>Depois que ele partiu, a menina passou a cuidar de si e do mundo ao redor enquanto aguardava, sem ter certeza do dia do retorno. O mundo voltou a ter encanto porque, em algum lugar, o pássaro estava voando livre.</p>
</template>
<template id="passaro-compreender">
<h2>Por que esta metáfora é importante</h2>
<p>Psi, essa metáfora oferece uma imagem potente para trabalhar amor, liberdade, individualidade, saudade, medo de abandono e comportamentos de controle. A gaiola representa tentativas de reduzir a incerteza e garantir a presença do outro, mas que podem retirar espontaneidade, confiança e vitalidade da relação.</p>
<div class="note amber"><p><strong>Cuidado central.</strong> Liberdade não significa aceitar negligência, infidelidade, desrespeito ou ausência de compromisso. Relações saudáveis combinam autonomia, acordos, reciprocidade, disponibilidade emocional e limites claros.</p></div>
<h2>Três lentes</h2>
<details class="lens"><summary>Terapia Cognitivo-Comportamental</summary><div class="lens-body"><p>Ajuda a examinar pensamentos como “se eu não controlar, serei abandonada”, “preciso saber onde a pessoa está” ou “dar espaço significa perder”. Permite avaliar consequências dos comportamentos de checagem, cobrança e vigilância e construir respostas alternativas.</p></div></details>
<details class="lens"><summary>Terapia do Esquema</summary><div class="lens-body"><p>Pode mobilizar Abandono/Instabilidade, Privação Emocional, Defectividade/Vergonha, Subjugação e busca de aprovação. A gaiola pode ser compreendida como uma estratégia de enfrentamento que tenta impedir a dor, mas termina produzindo distância e sofrimento.</p></div></details>
<details class="lens"><summary>Teoria do Apego</summary><div class="lens-body"><p>Permite observar estratégias ansiosas de hiperativação, como busca constante de garantia, ciúme e monitoramento. Também pode ajudar a construir segurança interna, tolerância à separação e confiança, sem confundir autonomia com desinteresse.</p></div></details>
<div class="block"><h3>Quando pode ser útil</h3><ul>
<li>Existem ciúme intenso, possessividade, checagens ou tentativas de controlar a rotina do outro.</li>
<li>A ausência ou a individualidade do outro provoca medo desproporcional.</li>
<li>A pessoa acredita que precisa “segurar” alguém para não ser abandonada.</li>
<li>O trabalho clínico envolve limites, autonomia, confiança e diferenciação.</li>
<li>A pessoa confunde proximidade com fusão ou amor com disponibilidade permanente.</li>
<li>Há condições para refletir sobre responsabilidade sem transformar a intervenção em acusação.</li>
</ul></div>
</template>
<template id="passaro-como">
<h2>Como introduzo e construo a ponte</h2>
<ol class="steps">
<li><strong>Valido o medo e a necessidade.</strong> “Percebo quanto a possibilidade de perder essa relação mobiliza você. Parece que controlar traz um alívio momentâneo, embora também tenha consequências.”</li>
<li><strong>Peço permissão.</strong> “Lembrei-me de uma história sobre amor, liberdade e uma gaiola. Posso compartilhar?”</li>
<li><strong>Conto a metáfora.</strong> Apresento a relação entre a menina e o pássaro, a saudade, a gaiola e a perda das cores.</li>
<li><strong>Exploro o que ressoou.</strong> “Que parte dessa história conversa com sua experiência?”</li>
<li><strong>Investigo a gaiola concreta.</strong> “Que atitudes tentam garantir que a pessoa não vá embora? O que essas atitudes aliviam por alguns minutos e o que produzem depois?”</li>
<li><strong>Identifico necessidades e acordos.</strong> Diferencio pedido legítimo, limite, compromisso e comportamento controlador.</li>
<li><strong>Construo uma pequena abertura.</strong> “Que portinha poderia ser aberta com segurança, sem abandonar suas necessidades?”</li>
</ol>
<h2>O que pode dar errado e como contorno</h2>
<div class="risk"><h3>A pessoa se identifica apenas com a dor da menina</h3><p>Valido a saudade e o medo sem apressar a responsabilização. Depois, quando houver abertura, exploro:</p><blockquote class="fala">“A dor da menina era real. Ao mesmo tempo, a gaiola trouxe o alívio que ela esperava ou aumentou a tristeza dos dois?”</blockquote></div>
<div class="risk"><h3>A imagem da gaiola parece exagerada</h3><p>Não uso o símbolo para acusar. Ajudo a traduzir comportamentos concretos:</p><blockquote class="fala">“Quando você verifica mensagens, exige respostas imediatas ou tenta decidir com quem a pessoa pode estar, isso aproxima, dá cor e confiança à relação ou a deixa mais tensa e cinzenta?”</blockquote></div>
<div class="risk"><h3>“Soltar” é entendido como aceitar qualquer coisa</h3><p>Esclareço que autonomia não elimina compromisso, conversa, limites ou consequências. Abrir a gaiola pode significar abandonar a vigilância e construir acordos claros, e não tolerar desrespeito.</p></div>
<div class="risk"><h3>O medo de abandono é intenso</h3><p>A ideia de abrir mão do controle pode ser aterrorizante. Trabalho gradualmente, fortalecendo regulação emocional, rede de apoio, identidade, comunicação e capacidade de sobreviver a possíveis perdas.</p></div>
<div class="risk"><h3>Há violência, coerção ou risco</h3><p>Não utilizo a metáfora para sugerir que alguém apenas “confie mais” em uma relação perigosa. Quando existem ameaça, perseguição, violência ou controle coercitivo, a prioridade é segurança, proteção e apoio especializado.</p></div>
<div class="risk"><h3>A metáfora culpabiliza apenas uma pessoa</h3><p>Uma relação é um sistema, mas cada pessoa continua responsável por suas ações. Investigo reciprocidade, acordos quebrados, indisponibilidade emocional e padrões de ambos sem justificar invasões ou controle.</p></div>
<h2>Estudo de caso: Leonardo</h2>
<div class="case">
<p>Leonardo, 30 anos, procura terapia devido a ciúme intenso e conflitos frequentes com a parceira. Controla a agenda, verifica mensagens e relata pavor de ser abandonado:</p>
<blockquote class="fala">“Não consigo viver sem ela. Preciso saber onde está o tempo todo; caso contrário, entro em desespero.”</blockquote>
<p>Seu padrão sugere medo de abandono, vergonha e estratégias ansiosas de busca de garantia. Antes da metáfora, reconheço o sofrimento:</p>
<blockquote class="fala">“Leonardo, essa necessidade de saber onde sua parceira está e o medo de perdê-la parecem muito dolorosos. Percebo que controlar tenta reduzir esse medo por alguns instantes, mas também está afetando vocês. Lembrei-me de uma história sobre amor, liberdade e uma gaiola. Posso contar?”</blockquote>
<p>Depois da narrativa, pergunto:</p>
<blockquote class="fala">“O que você percebe nessa história? Quando tenta prender seu pássaro por meio de checagens e cobranças, o que acontece com as cores, o canto e a confiança da relação?”</blockquote>
<blockquote class="fala">“Se abrir a gaiola não significasse abandonar suas necessidades, mas expressá-las por meio de acordos e pedidos, o que poderia mudar?”</blockquote>
<p>A conversa pode ajudar Leonardo a diferenciar amor de vigilância, compreender o ciclo medo, checagem, conflito, afastamento e mais medo, e construir alternativas como tolerar intervalos de resposta, comunicar necessidades, ampliar fontes de apoio e desenvolver recursos próprios de regulação.</p>
<p class="fict">O caso é fictício, composto ou rigorosamente descaracterizado para fins educativos.</p>
</div>
</template>

<li>Que experiências anteriores ensinaram que distância significa abandono?</li>
<li>O que seria liberdade com responsabilidade nessa relação?</li>
<li>Quais acordos são necessários para que ambos tenham segurança e individualidade?</li>

<p class="lead">Afinal, nós também amamos, sentimos saudade e podemos temer a perda.</p>
<section class="ap-step"><h3>1. Observe suas relações</h3><p>Pense em uma relação pessoal ou profissional na qual você já tenha sentido vontade de controlar, garantir, vigiar ou impedir um afastamento. O que você temia perder? O controle trouxe segurança duradoura ou apenas alívio momentâneo? O que aconteceu com a espontaneidade e a confiança?</p><textarea class="ap" aria-label="Suas relações"></textarea></section>
<section class="ap-step"><h3>2. Reconheça sua gaiola</h3><p>Que comportamentos funcionam como gaiolas em suas relações? Buscar garantias repetidamente, exigir disponibilidade constante, antecipar rejeição, evitar que o outro tenha autonomia, tentar controlar o ritmo, a resposta ou a proximidade.</p><textarea class="ap" aria-label="Sua gaiola"></textarea></section>
<section class="ap-step"><h3>3. Observe seus padrões de apego</h3><ul><li>Como você reage à distância?</li><li>Tende a perseguir, cobrar, se fechar ou fingir que não precisa?</li><li>Que história relacional influencia essa resposta?</li><li>De que apoio interno e externo precisa para sustentar a saudade?</li></ul><textarea class="ap" aria-label="Padrões de apego"></textarea></section>
<section class="ap-step"><h3>4. Abra uma pequena portinha</h3><p>Que atitude pode oferecer mais liberdade sem abandonar seus limites e necessidades? Fazer um pedido claro em vez de uma cobrança, tolerar um intervalo antes de buscar nova garantia, retomar um interesse próprio, combinar expectativas de contato, permitir uma escolha que não ameaça os acordos da relação.</p><textarea class="ap" aria-label="Pequena portinha"></textarea></section>
<section class="ap-step"><h3>5. Reflita sobre a relação terapêutica</h3><ul><li>Como você lida com a autonomia de seus pacientes?</li><li>Existe vontade de conduzir, convencer ou proteger além do necessário?</li><li>Como reage quando alguém discorda, se afasta ou encerra o processo?</li><li>Como pode modelar vínculo, liberdade, confiança e limites na própria relação terapêutica?</li></ul><textarea class="ap" aria-label="Relação terapêutica"></textarea></section>
<div class="final"><p><strong>Reflexão final.</strong> Vínculos seguros não dependem de aprisionamento. Eles se fortalecem quando proximidade e liberdade podem coexistir, com reciprocidade, acordos, respeito e capacidade de lidar com a saudade e a incerteza.</p></div>
</template>

<template id="eco-mensagem">Aquilo que comunicamos e fazemos pode participar da construção das respostas que recebemos. Observar o próprio modo de agir amplia responsabilidade e possibilidade de mudança, sem negar fatores externos ou responsabilizar alguém por tudo o que vive.</template>
<template id="eco-compreender">
<h2>Por que esta metáfora é importante</h2>
<p>Psi, essa metáfora é clara e didática para trabalhar responsabilidade pessoal, comunicação, diálogo interno e padrões relacionais. Ela convida a pessoa a observar o que comunica, como age e quais ciclos ajuda a manter, sem concluir que toda experiência é apenas reflexo de suas ações.</p>
<div class="note amber"><p><strong>Cuidado central.</strong> A vida não devolve mecanicamente tudo o que uma pessoa diz ou faz. Existem injustiças, violência, desigualdade, acaso e respostas alheias que não estão sob seu controle. O foco clínico deve ser a participação possível da pessoa no ciclo, nunca a culpa por tudo o que lhe acontece.</p></div>
<h2>Três lentes</h2>
<details class="lens"><summary>Terapia Cognitivo-Comportamental</summary><div class="lens-body"><p>Ajuda a compreender profecias autorrealizáveis, interpretações, diálogo interno e ciclos entre pensamento, comportamento e resposta do ambiente. Permite testar novas formas de comunicação e ação.</p></div></details>
<details class="lens"><summary>Terapia do Esquema</summary><div class="lens-body"><p>Pode iluminar Punitividade, Desconfiança/Abuso, Privação Emocional, Autossacrifício, busca de aprovação e Grandiosidade. Os esquemas influenciam aquilo que a pessoa espera, percebe, comunica e confirma nas relações.</p></div></details>
<details class="lens"><summary>Teoria do Apego</summary><div class="lens-body"><p>Favorece a compreensão dos ciclos de proximidade e afastamento. Estratégias ansiosas podem produzir cobranças e busca intensa de garantia; estratégias evitativas podem produzir silêncio e distância. Uma comunicação mais clara pode apoiar vínculos mais seguros.</p></div></details>
<div class="block"><h3>Quando pode ser útil</h3><ul>
<li>A pessoa percebe apenas fatores externos e tem dificuldade para reconhecer a própria participação em um ciclo.</li>
<li>Existe diálogo interno crítico, pessimista ou punitivo.</li>
<li>Há reclamações repetidas, críticas, hostilidade ou comunicação indireta.</li>
<li>A pessoa se sente frequentemente incompreendida.</li>
<li>O trabalho envolve assertividade, expressão de necessidades e limites.</li>
<li>Há condições para refletir sobre responsabilidade sem invalidar sofrimento ou injustiça.</li>
</ul></div>
</template>
<template id="eco-como">
<h2>Como introduzo e construo a ponte</h2>
<ol class="steps">
<li><strong>Valido a experiência.</strong> “Às vezes parece que o mundo está contra nós ou que ninguém nos compreende. Quero entender o que está acontecendo sem colocar toda a responsabilidade em você.”</li>
<li><strong>Peço permissão.</strong> “Lembrei-me de uma história sobre um menino, uma montanha e um eco. Posso contar?”</li>
<li><strong>Apresento a metáfora.</strong> Narro os diferentes gritos e as respostas da montanha.</li>
<li><strong>Exploro o que ressoou.</strong> “Que parte dessa história conversa com sua experiência?”</li>
<li><strong>Mapeio o ciclo.</strong> “O que você pensa, sente, comunica e faz? Como as outras pessoas costumam responder? O que acontece depois?”</li>
<li><strong>Diferencio controle e influência.</strong> Identificamos aquilo que depende da pessoa, aquilo que pode ser influenciado e aquilo que permanece fora de seu controle.</li>
<li><strong>Planejo um novo experimento.</strong> Escolhemos uma comunicação ou ação pequena, genuína e observável para testar.</li>
</ol>
<h2>O que pode dar errado e como contorno</h2>
<div class="risk"><h3>Culpabilização</h3><p>A pessoa pode entender que é responsável por tudo de ruim que viveu.</p><blockquote class="fala">“Você não é culpada pelo que outras pessoas fizeram nem pelas injustiças que enfrentou. Estamos observando apenas onde existe possibilidade de escolha e influência agora.”</blockquote></div>
<div class="risk"><h3>Minimização de problemas reais</h3><p>Não uso a metáfora para explicar violência, preconceito, exploração, adoecimento, desigualdade ou outras condições estruturais como simples consequência da atitude individual.</p></div>
<div class="risk"><h3>Positividade superficial</h3><p>Um novo eco não nasce de repetir frases nas quais a pessoa não acredita. O experimento precisa ser honesto, específico e acompanhado por ações coerentes.</p></div>
<div class="risk"><h3>Expectativa de reciprocidade automática</h3><p>Comunicar-se com respeito não garante que o outro responderá da mesma forma. O objetivo é agir de acordo com valores e limites, observar a resposta e decidir o próximo passo, inclusive afastar-se quando necessário.</p></div>
<div class="risk"><h3>Responsabilidade sem limite</h3><p>Evito transformar autorresponsabilidade em autocobrança excessiva. A pergunta não é “como provoquei isso?”, mas “qual é minha participação possível e o que desejo fazer agora?”.</p></div>
<h2>Estudo de caso: Carlos</h2>
<div class="case">
<p>Carlos, 40 anos, relata isolamento social e frustração profissional. Sente-se desvalorizado no trabalho, afirma que as pessoas nunca o compreendem e passa grande parte do tempo criticando colegas e o ambiente. Podem estar presentes Privação Emocional, Desconfiança e Punitividade, além de uma estratégia evitativa de afastamento diante da vulnerabilidade.</p>
<p>Eu poderia dizer:</p>
<blockquote class="fala">“Carlos, percebo quanto é doloroso sentir que as pessoas não entendem você e que o ambiente devolve apenas reclamações. Quero levar isso a sério. Ao mesmo tempo, lembrei-me de uma história que pode nos ajudar a observar o ciclo das interações: a história do eco. Posso contar?”</blockquote>
<p>Depois da narrativa, pergunto:</p>
<blockquote class="fala">“O que você percebe nessa história? Que mensagens você tem enviado ao ambiente de trabalho? Quando critica, se afasta ou aponta apenas o que não funciona, que resposta costuma receber?”</blockquote>
<blockquote class="fala">“Se você fizesse um experimento pequeno, como reconhecer um esforço real, formular um pedido claro ou propor uma solução, que eco gostaria de observar? E como cuidaria de si se a resposta não mudasse?”</blockquote>
<p>A metáfora pode ajudar Carlos a reconhecer sua participação sem negar problemas reais do ambiente. A partir daí, podemos trabalhar assertividade, colaboração, pedidos claros, limites e avaliação da reciprocidade.</p>
<p class="fict">O caso é fictício, composto ou rigorosamente descaracterizado para fins educativos.</p>
</div>
</template>
<template id="eco-perguntas">
<li>Que mensagem você tem enviado a si mesma?</li>
