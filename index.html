  <div class="ret-form">
    <div class="field ret-q"><label for="ret-nome">Seu nome<span class="hint">Para eu saber de quem é o retorno.</span></label><input type="text" id="ret-nome" data-ret="nome" value="${esc(r.nome||"")}"></div>
    <fieldset><legend>Quais metáforas você explorou?</legend><div class="opts">${METAFORAS.map(m=>`<label><input type="checkbox" data-ret-multi="metaforas" value="${m.id}" ${(r.metaforas||[]).includes(m.id)?"checked":""}>${esc(m.titulo)}</label>`).join("")}</div></fieldset>
    ${RET_Q.map(q).join("")}
    <div class="field ret-q"><label for="ret-mensagem">Deixe uma mensagem para mim<span class="hint">Pode ser um recado livre. Se ajudar, pense em contar: o que essa experiência despertou em você, um momento em que a metáfora fez sentido (ou não fez) e o que você sente que ainda falta para se sentir segura usando metáforas na prática.</span></label><textarea id="ret-mensagem" data-ret="mensagem">${esc(r.mensagem||"")}</textarea></div>
    <fieldset><legend>Posso usar seu retorno como depoimento?</legend><div class="opts">
      <label><input type="radio" name="ret-autoriza" data-ret="autoriza" value="Prefiro que fique só entre nós" ${r.autoriza==="Prefiro que fique só entre nós"?"checked":""}>Prefiro que fique só entre nós</label>
      <label><input type="radio" name="ret-autoriza" data-ret="autoriza" value="Sim, com meu nome" ${r.autoriza==="Sim, com meu nome"?"checked":""}>Sim, pode usar meu nome</label>
      <label><input type="radio" name="ret-autoriza" data-ret="autoriza" value="Sim, com meu nome e foto" ${r.autoriza==="Sim, com meu nome e foto"?"checked":""}>Sim, pode usar meu nome e foto</label>
    </div><p class="hint">Se topar com foto, combinamos separadamente como você me envia.</p></fieldset>
  </div>
  <p class="saved" id="savedRet"></p>
  <div class="btn-row">
    <a class="btn" id="retWa" href="${retWaLink()}" target="_blank" rel="noopener">Enviar pelo WhatsApp</a>
    <a class="btn ghost" id="retMail" href="${retMailLink()}">Enviar por e-mail</a>
    <button class="btn ghost" type="button" data-act="ret-copiar">Copiar respostas</button>
    <button class="btn small danger" type="button" data-act="ret-limpar">Apagar respostas</button>
  </div>
  <p class="muted" style="font-size:.88rem">Se o WhatsApp não abrir, use Copiar respostas e cole na conversa comigo, ou mande por e-mail para ${esc(RET_EMAIL)}.</p></div>`;
}
function retText(){
  const r=getRet(); const L=["Retorno do piloto — O Poder das Metáforas",""];
  L.push("Nome: "+(r.nome||"(não informado)"));
  L.push("Metáforas exploradas: "+((r.metaforas||[]).map(id=>find(id)?.titulo).filter(Boolean).join(", ")||"(nenhuma marcada)"));
  RET_Q.forEach(x=>{ const v=(r[x.k]||"").trim(); if(v){ L.push(""); L.push(x.l); L.push(v); } });
  if((r.mensagem||"").trim()){ L.push(""); L.push("Mensagem para a Ana"); L.push(r.mensagem.trim()); }
  L.push(""); L.push("Autoriza usar como depoimento: "+(r.autoriza||"(não respondido)"));
  return L.join("\n");
}
function retWaLink(){ return `https://wa.me/${WHATSAPP_NUM}?text=${encodeURIComponent(retText())}`; }
function retMailLink(){ return `mailto:${RET_EMAIL}?subject=${encodeURIComponent("Retorno do piloto — O Poder das Metáforas")}&body=${encodeURIComponent(retText())}`; }
function saveRet(k,v){ const r=getRet(); r[k]=v; if(store.set(K_RET,r)){ const a=document.getElementById("retWa"); if(a) a.href=retWaLink(); const b=document.getElementById("retMail"); if(b) b.href=retMailLink(); const el=document.getElementById("savedRet"); if(el){ el.textContent="Respostas guardadas neste navegador"; clearTimeout(el._h); el._h=setTimeout(()=>el.textContent="",1800); } } }

/* ---------- roteamento ---------- */
function parse(){
  const h=location.hash.replace(/^#/,"")||"/"; const [path,qs]=h.split("?");
  return {parts:path.split("/").filter(Boolean),params:Object.fromEntries(new URLSearchParams(qs||""))};
}
function render(){
  const {parts,params}=parse(); let html, nav="inicio", after=null;
  if(parts[0]==="metaforas"){ html=viewMetaforas(); nav="metaforas"; }
  else if(parts[0]==="registros"){ html=viewRegistros(); nav="registros"; }
  else if(parts[0]==="sobre"){ html=viewSobre(); nav="sobre"; }
  else if(parts[0]==="retorno"){ html=viewRetorno(); nav="retorno"; }
  else if(parts[0]==="m"&&find(parts[1])){
    const m=find(parts[1]);
    if(!PILOTO_ABERTAS.includes(m.id)){ location.hash="#/metaforas"; return; }
    const step=parts[2]||"compreender"; nav="metaforas";
    const cat=CATEGORIAS.find(c=>c.id===m.cat);
    const views={"compreender":viewCompreender,"como-faco":viewComoFaco,"autopratica":viewAutopratica,"preparar":viewPreparar,"compartilhar":viewCompartilhar};
    markVisited(m.id,step);
    html=`<div class="m-head"><a class="back" href="#/metaforas">Todas as metáforas</a>${FOTOS[m.id]?`<figure class="m-banner">${foto(m,"")}</figure>`:""}<p class="kicker">${esc(cat.nome)}</p><h1>${esc(m.titulo)}</h1><p class="lead">${esc(m.resumo)}</p></div>${journeyNav(m,step)}${(views[step]||viewCompreender)(m,params)}`;
    if(step==="autopratica") after=()=>hydrateAuto(m);
  } else html=viewInicio();
  $app.innerHTML=html; if(after) after();
  document.querySelectorAll("[data-nav]").forEach(a=>{ if(a.dataset.nav===nav) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current"); });
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",render);

/* ---------- eventos ---------- */
let saveTimer, pendingAuto=null, pendingReg=null;
function flash(id){ const el=document.getElementById(id); if(el){ el.textContent="Salvo neste navegador"; clearTimeout(el._h); el._h=setTimeout(()=>el.textContent="",1800); } }
function currentM(){ const p=parse().parts; return p[0]==="m"?find(p[1]):null; }
function refreshSheet(){ const m=currentM(); const s=document.getElementById("sheet"); if(m&&s) s.innerHTML=sheetHTML(m); }

$app.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset.ret&&t.type!=="radio"){ saveRet(t.dataset.ret,t.value); return; }
  const form=t.closest("[data-auto]");
  if(form&&t.classList.contains("ap")){
    if(!pendingAuto||pendingAuto.mid!==form.dataset.auto) pendingAuto={mid:form.dataset.auto,changes:{}};
    pendingAuto.changes[t.dataset.k]=t.value;
    clearTimeout(saveTimer); saveTimer=setTimeout(()=>{
      const all=store.get(K_AUTO,{}); all[pendingAuto.mid]=all[pendingAuto.mid]||{};
      Object.entries(pendingAuto.changes).forEach(([k,v])=>{ all[pendingAuto.mid][k]=v; });
      pendingAuto=null;
      if(store.set(K_AUTO,all)) flash("savedAuto");
    },350); return;
  }
  if(t.dataset.share==="mov"){ const m=currentM(); shareSel[m.id].mov=t.value; refreshSheet(); return; }
  if(t.dataset.reg&&t.dataset.path){
    if(!pendingReg||pendingReg.id!==t.dataset.reg) pendingReg={id:t.dataset.reg,changes:{}};
    pendingReg.changes[t.dataset.path]=t.value;
    clearTimeout(saveTimer); saveTimer=setTimeout(()=>{
      const regs=store.get(K_REG,[]); const r=regs.find(x=>x.id===pendingReg.id); if(!r){ pendingReg=null; return; }
      Object.entries(pendingReg.changes).forEach(([path,v])=>{ const [a,b]=path.split("."); if(b) r[a][b]=v; else r[a]=v; });
      r.atualizado=Date.now(); pendingReg=null;
      if(saveRegs(regs)) flash("savedReg");
    },350); return;
  }
});
$app.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset.ret&&t.type==="radio"){ saveRet(t.dataset.ret,t.value); return; }
  if(t.dataset.retMulti){ const cur=getRet()[t.dataset.retMulti]||[]; saveRet(t.dataset.retMulti, t.checked?[...new Set([...cur,t.value])]:cur.filter(x=>x!==t.value)); return; }
  if(t.dataset.check!==undefined){
    const regs=store.get(K_REG,[]); const r=regs.find(x=>x.id===t.dataset.reg); if(!r) return;
    const i=+t.dataset.check; r.checks=t.checked?[...new Set([...r.checks,i])]:r.checks.filter(x=>x!==i);
    r.atualizado=Date.now(); if(saveRegs(regs)) flash("savedReg");
  }
  if(t.dataset.share==="q"){ const m=currentM(); const s=shareSel[m.id]; const i=+t.dataset.i; s.qs=t.checked?[...new Set([...s.qs,i])]:s.qs.filter(x=>x!==i); refreshSheet(); }
  if(t.dataset.share==="msg"){ const m=currentM(); shareSel[m.id].msg=t.checked; refreshSheet(); }
});
function armed(b){
  if(b.classList.contains("armed")) return true;
  b.dataset.label=b.textContent; b.classList.add("armed"); b.textContent="Toque de novo para confirmar";
  clearTimeout(b._h); b._h=setTimeout(()=>{ b.classList.remove("armed"); b.textContent=b.dataset.label; },3500);
  return false;
}
$app.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]"); if(!b) return; const act=b.dataset.act;
  if(act==="nova"){ const r=newReg(b.dataset.m); location.hash=`#/m/${b.dataset.m}/preparar?reg=${r.id}`; }
  if(act==="tab") location.hash=`#/m/${b.dataset.m}/preparar?reg=${b.dataset.reg}&tab=${b.dataset.tab}`;
  if(act==="sessao"){ const r=getRegs().find(x=>x.id===b.dataset.reg); if(r) openSession(r); }
  if((act==="excluir"||act==="ret-limpar")&&!armed(b)) return;
  if(act==="excluir"){ saveRegs(store.get(K_REG,[]).filter(x=>x.id!==b.dataset.reg)); render(); toast("Preparação excluída"); }
  if(act==="copiar-reg"){ const r=getRegs().find(x=>x.id===b.dataset.reg); if(r) copy(regText(r)); }
  if(act==="copiar-share") copy(shareText(find(b.dataset.m)));
  if(act==="ret-copiar") copy(retText());
  if(act==="ret-limpar"){ try{ localStorage.removeItem(K_RET); }catch(_){} render(); toast("Respostas apagadas"); }
});
render();
</script>
</body>
</html>
