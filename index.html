<li>O que costuma comunicar aos outros: pedido, crítica, silêncio, ameaça ou afastamento?</li>
<li>Que resposta recebe com frequência?</li>
<li>Qual parte desse ciclo depende de você?</li>
<li>Qual parte não depende?</li>
<li>Que necessidade existe por trás do seu grito?</li>
<li>Como essa necessidade poderia ser expressa com mais clareza e limite?</li>
<li>Que novo comportamento seria possível testar sem esperar garantia de um resultado específico?</li>
</template>
<template id="eco-auto">
<section class="ap-step"><h3>1. Observe seus gritos durante um dia</h3><p>Preste atenção ao que você fala sobre sua rotina, seus pacientes, sua prática e sobre si mesma. Que palavras aparecem com frequência? Seu diálogo interno acolhe, orienta, pune ou desqualifica? Que emoções e ações surgem depois dessa fala?</p><textarea class="ap" aria-label="Seus gritos"></textarea></section>
<section class="ap-step"><h3>2. Observe os ecos</h3><ul><li>Que respostas você recebe das pessoas?</li><li>Existe algum ciclo que se repete?</li><li>Qual parte pode estar relacionada ao seu modo de comunicar?</li><li>Qual parte não está sob seu controle?</li></ul><textarea class="ap" aria-label="Os ecos"></textarea></section>
<section class="ap-step"><h3>3. Escolha um novo experimento</h3><p>Selecione um padrão que gostaria de modificar por um dia. Não substitua por uma frase artificial; escolha uma comunicação verdadeira e construtiva. Trocar uma crítica genérica por um pedido específico, reconhecer um esforço real, expressar um limite com clareza, falar consigo como falaria com uma colega querida, propor uma ação em vez de repetir apenas a reclamação.</p><textarea class="ap" aria-label="Novo experimento"></textarea></section>
<section class="ap-step"><h3>4. Reflita sobre a relação terapêutica</h3><ul><li>Que eco sua postura oferece quando a pessoa fala sobre falhas?</li><li>Você devolve apenas déficits ou também reconhece recursos e movimentos?</li><li>Como oferecer validação sem reforçar esquivas ou padrões disfuncionais?</li><li>Como respeitar autonomia e discordância?</li><li>Como garantir que a metáfora não seja usada para culpabilizar?</li></ul><textarea class="ap" aria-label="Relação terapêutica"></textarea></section>
<div class="final"><p><strong>Reflexão final.</strong> Autorresponsabilidade não significa acreditar que controlamos o mundo. Significa reconhecer com honestidade onde nossas palavras e ações participam dos ciclos e escolher, quando possível, respostas mais coerentes com nossos valores, necessidades e limites.</p></div>

const store = {

  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } }
};
const K_REG="pdm:preparacoes", K_AUTO="pdm:autopratica:v2";

const fmtDate=t=>new Date(t).toLocaleDateString("pt-BR",{day:"2-digit",month:"short",year:"numeric"});
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("on"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("on"),2200); }
async function copy(text){
  try{ await navigator.clipboard.writeText(text); toast("Texto copiado"); }
  catch(e){ const ta=document.createElement("textarea"); ta.value=text; document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); toast("Texto copiado"); }catch(_){ toast("Não foi possível copiar. Selecione o texto manualmente."); } ta.remove(); }
}
function storyText(id){
  const t=document.getElementById(id+"-historia"); if(!t) return "";
  return [...t.content.children].filter(el=>!el.classList.contains("pendente")).map(el=>el.textContent.trim()).join("\n\n");
}

function sheetHTML(m){

  const story=[...t.content.children].filter(el=>!el.classList.contains("pendente")).map(el=>el.outerHTML).join("");

  return `<h2>${esc(m.titulo)}</h2><div class="story">${story}</div>${m.credito?`<p class="origem">${esc(m.credito)}</p>`:""}

    ${sel.mov.trim()?`<h3>Um pequeno movimento</h3><p>${esc(sel.mov)}</p>`:""}`;
}
function shareText(m){
  const sel=shareSel[m.id], qs=perguntas(m.id), msg=tplText(m.id+"-mensagem");
  let t=`${m.titulo}\n\n${storyText(m.id)}`;
  if(m.credito) t+=`\n\n${m.credito}`;
  if(sel.msg&&msg) t+=`\n\nO que essa história pode nos ajudar a pensar\n${msg}`;
  const chosen=sel.qs.slice().sort((a,b)=>a-b).map(i=>qs[i]);
  if(chosen.length) t+=`\n\nPara refletir, se fizer sentido para você\n${chosen.map(q=>"• "+q).join("\n")}`;
  if(sel.mov.trim()) t+=`\n\nUm pequeno movimento\n${sel.mov.trim()}`;
  return t;
}

  {k:"funcionou",t:"text",l:"O que funcionou melhor para você?"},
  {k:"faltou",t:"text",l:"O que faltou, confundiu ou atrapalhou?"},
  {k:"sessao",t:"text",l:"Se usou em sessão, como a pessoa recebeu a metáfora?",h:"De forma geral. Sem nomes, idades ou detalhes que identifiquem quem você atende."},
  {k:"novas",t:"text",l:"Que tema ou metáfora você gostaria de encontrar aqui?"},
  {k:"indicaria",t:"radio",l:"Você indicaria o app a uma colega?",o:["Com certeza","Provavelmente","Talvez","Não"]},
  {k:"assinaria",t:"radio",l:"Se o app fosse pago, você assinaria?",o:["Sim","Talvez, depende do valor","Não"]},
  {k:"valor",t:"line",l:"Que valor mensal você consideraria justo?",h:"Opcional."}
];
const getRet=()=>store.get(K_RET,{nome:"",metaforas:[]});
function viewRetorno(){
  const r=getRet();
  const q=x=>{
    if(x.t==="radio") return `<fieldset><legend>${esc(x.l)}</legend><div class="opts">${x.o.map(o=>`<label><input type="radio" name="ret-${x.k}" data-ret="${x.k}" value="${esc(o)}" ${r[x.k]===o?"checked":""}>${esc(o)}</label>`).join("")}</div></fieldset>`;
    const hint=x.h?`<span class="hint">${esc(x.h)}</span>`:"";
    if(x.t==="line") return `<div class="field ret-q"><label for="ret-${x.k}">${esc(x.l)}${hint}</label><input type="text" id="ret-${x.k}" data-ret="${x.k}" value="${esc(r[x.k]||"")}"></div>`;
    return `<div class="field ret-q"><label for="ret-${x.k}">${esc(x.l)}${hint}</label><textarea id="ret-${x.k}" data-ret="${x.k}">${esc(r[x.k]||"")}</textarea></div>`;
  };
  return `<div class="narrow"><h1>Seu retorno sobre o piloto</h1>
  <p class="lead">Obrigada por testar comigo. Suas respostas vão decidir o que permanece, o que muda e o que ainda falta antes de o app chegar a outras colegas.</p>
  <div class="note"><p>As respostas ficam guardadas neste navegador até você enviar. Nada vai para um servidor: você me manda o texto pelo WhatsApp ou copia e cola onde preferir. Não inclua dados que identifiquem pessoas atendidas.</p></div>
  <div class="ret-form">
    <div class="field ret-q"><label for="ret-nome">Seu nome<span class="hint">Para eu saber de quem é o retorno.</span></label><input type="text" id="ret-nome" data-ret="nome" value="${esc(r.nome||"")}"></div>
    <fieldset><legend>Quais metáforas você explorou?</legend><div class="opts">${METAFORAS.map(m=>`<label><input type="checkbox" data-ret-multi="metaforas" value="${m.id}" ${(r.metaforas||[]).includes(m.id)?"checked":""}>${esc(m.titulo)}</label>`).join("")}</div></fieldset>
    ${RET_Q.map(q).join("")}
  </div>
  <p class="saved" id="savedRet"></p>
  <div class="btn-row">
    <a class="btn" id="retWa" href="${retWaLink()}" target="_blank" rel="noopener">Enviar pelo WhatsApp</a>
    <button class="btn ghost" type="button" data-act="ret-copiar">Copiar respostas</button>
    <button class="btn small danger" type="button" data-act="ret-limpar">Apagar respostas</button>
  </div>
  <p class="muted" style="font-size:.88rem">Se o WhatsApp não abrir, use Copiar respostas e cole na conversa comigo.</p></div>`;
}
function retText(){
  const r=getRet(); const L=["Retorno do piloto — O Poder das Metáforas",""];
  L.push("Nome: "+(r.nome||"(não informado)"));
  L.push("Metáforas exploradas: "+((r.metaforas||[]).map(id=>find(id)?.titulo).filter(Boolean).join(", ")||"(nenhuma marcada)"));
  RET_Q.forEach(x=>{ const v=(r[x.k]||"").trim(); if(v){ L.push(""); L.push(x.l); L.push(v); } });
  return L.join("\n");
}
function retWaLink(){ return `https://wa.me/${WHATSAPP_NUM}?text=${encodeURIComponent(retText())}`; }
function saveRet(k,v){ const r=getRet(); r[k]=v; if(store.set(K_RET,r)){ const a=document.getElementById("retWa"); if(a) a.href=retWaLink(); const el=document.getElementById("savedRet"); if(el){ el.textContent="Respostas guardadas neste navegador"; clearTimeout(el._h); el._h=setTimeout(()=>el.textContent="",1800); } } }

/* ---------- roteamento ---------- */
function parse(){
  const h=location.hash.replace(/^#/,"")||"/"; const [path,qs]=h.split("?");
  return {parts:path.split("/").filter(Boolean),params:Object.fromEntries(new URLSearchParams(qs||""))};
}
function render(){
  const {parts,params}=parse(); let html, nav="inicio", after=null;
  if(parts[0]==="metaforas"){ html=viewMetaforas(); nav="metaforas"; }
  else if(parts[0]==="registros"){ html=viewRegistros(); nav="registros"; }
  else if(parts[0]==="sobre"){ html=viewSobre(); nav="sobre"; }
  else if(parts[0]==="retorno"){ html=viewRetorno(); nav="retorno"; }
  else if(parts[0]==="m"&&find(parts[1])){
    const m=find(parts[1]); const step=parts[2]||"compreender"; nav="metaforas";
    const cat=CATEGORIAS.find(c=>c.id===m.cat);
    const views={"compreender":viewCompreender,"como-faco":viewComoFaco,"autopratica":viewAutopratica,"preparar":viewPreparar,"compartilhar":viewCompartilhar};
    html=`<div class="m-head"><a class="back" href="#/metaforas">Todas as metáforas</a><p class="kicker">${esc(cat.nome)}</p><h1>${esc(m.titulo)}</h1><p class="lead">${esc(m.resumo)}</p></div>${journeyNav(m,step)}${(views[step]||viewCompreender)(m,params)}`;
    if(step==="autopratica") after=()=>hydrateAuto(m);
  } else html=viewInicio();
  $app.innerHTML=html; if(after) after();
  document.querySelectorAll("[data-nav]").forEach(a=>{ if(a.dataset.nav===nav) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current"); });
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",render);

/* ---------- eventos ---------- */
let saveTimer;
function flash(id){ const el=document.getElementById(id); if(el){ el.textContent="Salvo neste navegador"; clearTimeout(el._h); el._h=setTimeout(()=>el.textContent="",1800); } }
function currentM(){ const p=parse().parts; return p[0]==="m"?find(p[1]):null; }
function refreshSheet(){ const m=currentM(); const s=document.getElementById("sheet"); if(m&&s) s.innerHTML=sheetHTML(m); }

$app.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset.ret&&t.type!=="radio"){ saveRet(t.dataset.ret,t.value); return; }
  const form=t.closest("[data-auto]");
  if(form&&t.classList.contains("ap")){
    const all=store.get(K_AUTO,{}); all[form.dataset.auto]=all[form.dataset.auto]||{}; all[form.dataset.auto][t.dataset.k]=t.value;
    clearTimeout(saveTimer); saveTimer=setTimeout(()=>{ if(store.set(K_AUTO,all)) flash("savedAuto"); },350); return;
  }
  if(t.dataset.share==="mov"){ const m=currentM(); shareSel[m.id].mov=t.value; refreshSheet(); return; }
  if(t.dataset.reg&&t.dataset.path){
    const regs=store.get(K_REG,[]); const r=regs.find(x=>x.id===t.dataset.reg); if(!r) return;
    const [a,b]=t.dataset.path.split("."); if(b) r[a][b]=t.value; else r[a]=t.value; r.atualizado=Date.now();
    clearTimeout(saveTimer); saveTimer=setTimeout(()=>{ if(saveRegs(regs)) flash("savedReg"); },350);
  }
});
$app.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset.ret&&t.type==="radio"){ saveRet(t.dataset.ret,t.value); return; }
  if(t.dataset.retMulti){ const cur=getRet()[t.dataset.retMulti]||[]; saveRet(t.dataset.retMulti, t.checked?[...new Set([...cur,t.value])]:cur.filter(x=>x!==t.value)); return; }
  if(t.dataset.check!==undefined){
    const regs=store.get(K_REG,[]); const r=regs.find(x=>x.id===t.dataset.reg); if(!r) return;
    const i=+t.dataset.check; r.checks=t.checked?[...new Set([...r.checks,i])]:r.checks.filter(x=>x!==i);
    r.atualizado=Date.now(); if(saveRegs(regs)) flash("savedReg");
  }
  if(t.dataset.share==="q"){ const m=currentM(); const s=shareSel[m.id]; const i=+t.dataset.i; s.qs=t.checked?[...new Set([...s.qs,i])]:s.qs.filter(x=>x!==i); refreshSheet(); }
  if(t.dataset.share==="msg"){ const m=currentM(); shareSel[m.id].msg=t.checked; refreshSheet(); }
});
function armed(b){
  if(b.classList.contains("armed")) return true;
  b.dataset.label=b.textContent; b.classList.add("armed"); b.textContent="Toque de novo para confirmar";
  clearTimeout(b._h); b._h=setTimeout(()=>{ b.classList.remove("armed"); b.textContent=b.dataset.label; },3500);
  return false;
}
$app.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]"); if(!b) return; const act=b.dataset.act;
  if(act==="nova"){ const r=newReg(b.dataset.m); location.hash=`#/m/${b.dataset.m}/preparar?reg=${r.id}`; }
  if(act==="tab") location.hash=`#/m/${b.dataset.m}/preparar?reg=${b.dataset.reg}&tab=${b.dataset.tab}`;
  if(act==="sessao"){ const r=getRegs().find(x=>x.id===b.dataset.reg); if(r) openSession(r); }
  if((act==="excluir"||act==="ret-limpar")&&!armed(b)) return;
  if(act==="excluir"){ saveRegs(store.get(K_REG,[]).filter(x=>x.id!==b.dataset.reg)); render(); toast("Preparação excluída"); }
  if(act==="copiar-reg"){ const r=getRegs().find(x=>x.id===b.dataset.reg); if(r) copy(regText(r)); }
  if(act==="copiar-share") copy(shareText(find(b.dataset.m)));
  if(act==="ret-copiar") copy(retText());
  if(act==="ret-limpar"){ try{ localStorage.removeItem(K_RET); }catch(_){} render(); toast("Respostas apagadas"); }
});
render();
</script>
</body>
</html>
